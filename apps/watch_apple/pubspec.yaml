name: vsp_watch_apple
description: Vietnam Smart Golf Platform — Apple Watch App
publish_to: none

version: 0.1.0+1

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Watch connectivity (phone<->watch bridge; latest published series)
  watch_connectivity: ^0.2.0
  # Local storage for watch (using shared_preferences as lightweight option)
  shared_preferences: ^2.2.2
  # UUID for idempotency
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
