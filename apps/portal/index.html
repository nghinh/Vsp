<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vietnam Smart Golf Platform course operations portal" />
    <!--
      A flag on the tab, and no 404 in the console.

      Every page load asked for /favicon.ico, got nothing, and logged an error
      — the only error the portal produced, which is enough noise to make a
      real one easy to miss. Inline rather than a file: it is nine shapes, it
      needs no build step and no request, and it cannot go missing the way an
      asset in public/ can.

      The orange is --primary, the same flag the app draws.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060e20'/%3E%3Cpath d='M12 7v18' stroke='%23f66018' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M13 8h9l-3 3.5 3 3.5h-9z' fill='%23f66018'/%3E%3Cellipse cx='13' cy='25' rx='5' ry='1.8' fill='%23f66018' opacity='.55'/%3E%3C/svg%3E"
    />
    <title>VSP Course Operations</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
