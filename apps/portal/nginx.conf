server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` so they ride error responses too, and set at
    # server level so both the SPA and the /api/ proxy inherit them (neither
    # location defines its own add_header, so nothing overrides these).
    #
    # frame-ancestors 'none' + X-Frame-Options DENY: this is an operations
    # portal, never meant to be embedded, so refuse framing outright — that is
    # the clickjacking defence. A resource-restricting CSP (script/style/connect)
    # is deliberately NOT set here: maplibre-gl loads workers from blob: and
    # draws to canvas, so a wrong policy blanks the map. Add it once it has been
    # verified in a browser against every map view.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip for the SPA assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history-mode routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container (same-origin -> no CORS).
    # Trailing slash on proxy_pass strips the /api/ prefix: /api/courses -> /courses.
    location /api/ {
        proxy_pass http://vsp-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
