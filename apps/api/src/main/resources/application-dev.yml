server:
  port: 8080

spring:
  application:
    name: vsp-api-dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsp}
    username: ${POSTGRES_USER:vsp}
    password: ${POSTGRES_PASSWORD:vsp_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Dev observability — verbose plain-text logs; tracing at 100%
logging:
  level:
    root: DEBUG
    vnpt.vsp: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: DEBUG
    org.apache.catalina: INFO
    io.opentelemetry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-—}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# Dev-only JWT signing key (>= 256 bits for HS256). Staging/prod MUST supply
# JWT_SECRET via environment — this default is intentionally insecure and local-only.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-do-not-use-in-prod-0123456789}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
