server:
  port: 8080

spring:
  application:
    name: vsp-api-dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsp}
    username: ${POSTGRES_USER:vsp}
    password: ${POSTGRES_PASSWORD:vsp_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  # The divergence this note used to describe is fixed: V16-V19 now use BIGINT
  # identities for golf_facilities/courses/holes, V0 installs PostGIS so the
  # spatial migrations can run at all, and V34 closes the remaining 10 tables /
  # 175 columns / 69 column types. FlywaySchemaMatchesEntityModelTest proves it
  # on every run by migrating an empty database and validating it against the
  # entity model.
  #
  # Dev still builds its schema with ddl-auto because the dev database already
  # exists with data and no flyway_schema_history, and baseline-on-migrate is
  # now off (see application.yml) — Flyway would rightly refuse it. A dev
  # database created from empty can and should run the migrations instead.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed/dev-seed.sql
      continue-on-error: true

# Dev observability — verbose plain-text logs; tracing at 100%
logging:
  level:
    root: DEBUG
    vnpt.vsp: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: DEBUG
    org.apache.catalina: INFO
    io.opentelemetry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-—}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# Dev-only JWT signing key (>= 256 bits for HS256). Staging/prod MUST supply
# JWT_SECRET via environment — this default is intentionally insecure and local-only.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-do-not-use-in-prod-0123456789}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000

# Dev-only affordances. In dev there is no real SMS/email delivery, so registration
# OTPs are only written to the logs. This master OTP lets any account complete
# phone/email verification (and password recovery) by entering 000000. It is unset
# outside the dev profile, so staging/prod verification is unaffected.
vsp:
  dev:
    master-otp: ${VSP_DEV_MASTER_OTP:000000}
