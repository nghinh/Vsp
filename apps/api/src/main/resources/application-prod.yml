# Production environment observability config
# JSON structured logging (LogstashEncoder); sampling rules; alerting thresholds

server:
  port: 8080
  # TLS 1.3 — keystore and truststore paths loaded from env vars (no hardcoded secrets)
  ssl:
    enabled: true
    protocol: TLSv1.3
    enabled-protocols: TLSv1.3
    # Restricted cipher suite list — no RC4, DES, 3DES, MD5, SHA-1 for hash
    # Ordered: ECDHE first (forward secrecy), then FIPS-compliant AES-256 GCM
    cipher-suite: TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    client-auth: need
    key-store: ${VSP_SSL_KEYSTORE_PATH}
    key-store-password: ${VSP_SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    trust-store: ${VSP_SSL_TRUSTSTORE_PATH}
    trust-store-password: ${VSP_SSL_TRUSTSTORE_PASSWORD}
    trust-store-type: PKCS12
    # SSL session cache to reduce handshake overhead
    session-cache-size: 8192
    session-timeout: 86400

spring:
  application:
    name: vsp-api-prod

logging:
  level:
    root: INFO
    vnpt.vsp: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.apache.catalina: WARN
    io.opentelemetry: INFO
  # LogstashEncoder in logback-spring.xml (prod profile) produces JSON to stdout.
  # Structured fields include: @timestamp, message, logger, thread, level, correlationId (MDC).
  # MDC is cleared on each request boundary by CorrelationIdFilter.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.90,0.95,0.99
  tracing:
    sampling:
      probability: 0.1
    propagation:
      produce: W3C
      consume: W3C

# Production alert thresholds (AlertRules.java reads these)
alert:
  thresholds:
    api:
      latency-p99-ms: 1000
      error-rate-percent: 0.5
    sync:
      queue-depth-warning: 50
      queue-depth-critical: 200
    gps:
      accuracy-warning-m: 10
      accuracy-critical-m: 25
    package:
      download-failure-rate-percent: 1.0
