server:
  port: 8080

spring:
  application:
    name: vsp-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsp}
    username: ${POSTGRES_USER:vsp}
    password: ${POSTGRES_PASSWORD:vsp_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    # Deliberately false. baseline-on-migrate stamps a non-empty schema as being
    # at baseline-version — which defaults to 1 — and then applies only what
    # comes after it. Pointed at any database built the way dev builds its own
    # (Hibernate ddl-auto), it would skip V0 and V1 and report success, leaving
    # PostGIS uninstalled and the first spatial migration to fail. With it off,
    # a schema that Flyway has never seen is either migrated from empty or
    # refused out loud, which is the only honest pair of outcomes.
    baseline-on-migrate: false
    locations: classpath:db/migration
    # A migration file that does not match V<version>__<description>.sql is
    # skipped with a single INFO line. That is exactly how 001_baseline.sql —
    # the file that installs PostGIS — never ran, and how 18 later migrations
    # became unreachable without anyone seeing an error.
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.latency: true
      percentiles:
        http.server.requests: 0.5,0.90,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

audit:
  retention-days: 2555  # 7-year compliance per NFR10

security:
  jwt:
    secret: ${JWT_SECRET:}  # Must be set in environment; min 256 bits (32 bytes) for HS256
    access-token-expiration-ms: 3600000    # 1 hour
    refresh-token-expiration-ms: 604800000 # 7 days
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Data quality stale record cache TTL (5 minutes per Story 9.4 Slice Plan)
cache:
  stale-records:
    ttl-minutes: 5

# Weather module configuration
weather:
  provider: ${WEATHER_PROVIDER:mock}  # mock | openweathermap | tomorrow_io
  cache:
    ttl-minutes: 30
  openweathermap:
    api-key: ${OPENWEATHERMAP_API_KEY:}
    base-url: https://api.openweathermap.org/data/2.5
  tomorrow-io:
    api-key: ${TOMORROW_IO_API_KEY:}
    base-url: https://api.tomorrow.io/v4

# Resilience4j circuit breaker configuration for weather provider
resilience4j:
  circuitbreaker:
    instances:
      weather-provider:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

# Admin MFA
vsp:
  mfa:
    # How often one account may fail a TOTP check. A six-digit code with RFC 6238's
    # ±1 step tolerance leaves ~3 live codes in a million, so five attempts per
    # quarter hour puts an exhaustive search past any useful horizon while leaving
    # an admin typing their own code far below the ceiling. Only failures count —
    # a correct code clears the account — and a refused attempt is 429
    # VSP-ERR-MFA-005 and a vsp_api.mfa.attempts.throttled increment.
    rate-limit:
      max-attempts: ${VSP_MFA_MAX_ATTEMPTS:5}
      window: ${VSP_MFA_ATTEMPT_WINDOW:PT15M}
      # Upper bound on accounts tracked at once, so a caller that can name
      # arbitrary account ids cannot grow the map without limit. Evicting an
      # entry can only forgive failures, never invent them.
      tracked-accounts: 10000

  # Google and Apple sign-in.
  #
  # client-ids is the audience an identity token must name to be accepted here:
  # the OAuth client id issued to this deployment by Google, and the bundle id
  # or services id registered with Apple. Both default to empty, and empty
  # means every token from that provider is refused — a deployment that has not
  # been told which application it is cannot tell a token minted for it from a
  # token minted for anyone else, and guessing is how an attacker signs in with
  # a genuine token issued to their own app. Set them per environment.
  #
  # Comma-separated, because a real deployment has one client id per platform
  # (iOS, Android, web) and all of them are ours.
  auth:
    social:
      clock-skew: ${VSP_SOCIAL_CLOCK_SKEW:PT1M}
      google:
        jwks-uri: "${VSP_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}"
        issuers: "${VSP_GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}"
        client-ids: "${VSP_GOOGLE_CLIENT_IDS:}"
      apple:
        jwks-uri: "${VSP_APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}"
        issuers: "${VSP_APPLE_ISSUERS:https://appleid.apple.com}"
        client-ids: "${VSP_APPLE_CLIENT_IDS:}"
      jwks:
        # Providers rotate on the order of days; an hour of cache keeps a
        # sign-in from depending on their endpoint being up at that instant.
        cache-ttl: ${VSP_JWKS_CACHE_TTL:PT1H}
        min-refresh-interval: ${VSP_JWKS_MIN_REFRESH:PT1M}
        request-timeout: ${VSP_JWKS_TIMEOUT:PT5S}
