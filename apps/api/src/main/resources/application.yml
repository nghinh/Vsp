server:
  port: 8080

spring:
  application:
    name: vsp-api
  servlet:
    multipart:
      # A golfer photographing the card at the first tee, which is the only way
      # pars and stroke indexes ever enter this platform. Spring's default is
      # 1 MB and no phone photo is that small, so every scan failed — and it
      # failed in Tomcat's multipart parser, before the request reached
      # ScorecardController, whose own 8 MB check and "the photograph is larger
      # than 8 MB" message were therefore unreachable code.
      #
      # 8 MB matches that check. The request cap is a little larger to leave
      # room for the multipart envelope and the other form fields beside the
      # image; capping the request at exactly the file size rejects a valid
      # 8 MB photo for the few hundred bytes of boundary around it.
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vsp}
    username: ${POSTGRES_USER:vsp}
    password: ${POSTGRES_PASSWORD:vsp_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    # Deliberately false. baseline-on-migrate stamps a non-empty schema as being
    # at baseline-version — which defaults to 1 — and then applies only what
    # comes after it. Pointed at any database built the way dev builds its own
    # (Hibernate ddl-auto), it would skip V0 and V1 and report success, leaving
    # PostGIS uninstalled and the first spatial migration to fail. With it off,
    # a schema that Flyway has never seen is either migrated from empty or
    # refused out loud, which is the only honest pair of outcomes.
    baseline-on-migrate: false
    locations: classpath:db/migration
    # A migration file that does not match V<version>__<description>.sql is
    # skipped with a single INFO line. That is exactly how 001_baseline.sql —
    # the file that installs PostGIS — never ran, and how 18 later migrations
    # became unreachable without anyone seeing an error.
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.latency: true
      percentiles:
        http.server.requests: 0.5,0.90,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

audit:
  retention-days: 2555  # 7-year compliance per NFR10

security:
  jwt:
    secret: ${JWT_SECRET:}  # Must be set in environment; min 256 bits (32 bytes) for HS256
    access-token-expiration-ms: 3600000    # 1 hour
    refresh-token-expiration-ms: 604800000 # 7 days
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Data quality stale record cache TTL (5 minutes per Story 9.4 Slice Plan)
cache:
  stale-records:
    ttl-minutes: 5

# Weather module configuration
weather:
  provider: ${WEATHER_PROVIDER:mock}  # mock | openweathermap | tomorrow_io
  cache:
    ttl-minutes: 30
  openweathermap:
    api-key: ${OPENWEATHERMAP_API_KEY:}
    base-url: https://api.openweathermap.org/data/2.5
  tomorrow-io:
    api-key: ${TOMORROW_IO_API_KEY:}
    base-url: https://api.tomorrow.io/v4

# Resilience4j circuit breaker configuration for weather provider
resilience4j:
  circuitbreaker:
    instances:
      weather-provider:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

# Admin MFA
vsp:
  # Registration OTPs are logged, not delivered — sendOtp() writes
  # "SIMULATED SMS/EMAIL" to the log and returns. On any environment without a
  # real SMS or email provider that makes the verification screen a dead end:
  # the account is created PENDING and no code ever arrives, so the golfer is
  # stuck and cannot even reuse the address. The dev profile escaped this with
  # a master OTP, but the property lived only in application-dev.yml, so a
  # staging deployment had no way to switch it on short of a code change.
  #
  # Empty by default, and empty means disabled — no environment gains a
  # bypass by upgrading. Set VSP_DEV_MASTER_OTP on a test deployment to make
  # verification passable; leave it unset in production, where a real provider
  # belongs instead.
  dev:
    master-otp: ${VSP_DEV_MASTER_OTP:}

  # Satellite imagery for the hole map, served to the app at /config/basemap.
  #
  # Unset by default, and an unset deployment is a working one: the app says it
  # has no imagery and the measuring tool keeps working over a plain canvas.
  # Setting it here rather than at app build time means imagery can be switched
  # on for a pilot, or off after a billing surprise, without shipping a release
  # — a --dart-define cannot be changed on a phone that already has the app.
  #
  # mapbox-access-token MUST be a PUBLIC token (pk.). Public tokens are meant
  # for client distribution and are restricted by URL at Mapbox's end; a secret
  # token (sk.) is account credentials and is refused rather than served.
  #
  # satellite-tile-url is for an operator with their own licensed imagery — a
  # club's orthophotos, a national imagery service. It wins over Mapbox, and it
  # is ignored unless satellite-attribution is also set: imagery we cannot
  # credit is imagery we do not display.
  basemap:
    mapbox-access-token: "${MAPBOX_ACCESS_TOKEN:}"
    satellite-tile-url: "${VSP_SATELLITE_TILE_URL:}"
    satellite-attribution: "${VSP_SATELLITE_ATTRIBUTION:}"
    # Deepest zoom that endpoint actually serves. 0 leaves it to the client.
    # Setting it accurately matters: a client that keeps requesting past the
    # last level gets 404s and shows nothing at exactly the zoom a golfer uses
    # to look at a green.
    satellite-max-zoom: ${VSP_SATELLITE_MAX_ZOOM:0}

  mfa:
    # How often one account may fail a TOTP check. A six-digit code with RFC 6238's
    # ±1 step tolerance leaves ~3 live codes in a million, so five attempts per
    # quarter hour puts an exhaustive search past any useful horizon while leaving
    # an admin typing their own code far below the ceiling. Only failures count —
    # a correct code clears the account — and a refused attempt is 429
    # VSP-ERR-MFA-005 and a vsp_api.mfa.attempts.throttled increment.
    rate-limit:
      max-attempts: ${VSP_MFA_MAX_ATTEMPTS:5}
      window: ${VSP_MFA_ATTEMPT_WINDOW:PT15M}
      # Upper bound on accounts tracked at once, so a caller that can name
      # arbitrary account ids cannot grow the map without limit. Evicting an
      # entry can only forgive failures, never invent them.
      tracked-accounts: 10000

  # Google and Apple sign-in.
  #
  # client-ids is the audience an identity token must name to be accepted here:
  # the OAuth client id issued to this deployment by Google, and the bundle id
  # or services id registered with Apple. Both default to empty, and empty
  # means every token from that provider is refused — a deployment that has not
  # been told which application it is cannot tell a token minted for it from a
  # token minted for anyone else, and guessing is how an attacker signs in with
  # a genuine token issued to their own app. Set them per environment.
  #
  # Comma-separated, because a real deployment has one client id per platform
  # (iOS, Android, web) and all of them are ours.
  # Reading a club's printed scorecard out of a photograph. Empty by default:
  # a deployment without a key boots normally and the two extract endpoints
  # answer "not configured" rather than failing at startup. The key belongs in
  # the deployment's env file, never in the repository.
  ocr:
    base-url: "${VSP_OCR_BASE_URL:}"
    api-key: "${VSP_OCR_API_KEY:}"
    model: "${VSP_OCR_MODEL:}"

  # Where the photograph a card was read from is kept.
  #
  # This used to be nowhere. The reader took an image, returned the pars and
  # yardages, and dropped the bytes; the only way to attach evidence was for
  # the golfer to type a URL into a text box, so the review portal's evidence
  # panel said "no photograph attached" for every card ever submitted and the
  # reviewer approved numbers rather than a card.
  #
  # That matters more here than it looks. A table that adds up cannot be told
  # from a table someone generated — the printed totals agree either way — and
  # the photograph is the only thing that can tell them apart. Nine fabricated
  # cards were published before anyone had a way to check, and without the
  # image a published card cannot be re-checked at all.
  #
  # Point this at a MOUNTED VOLUME. A path inside the container's own
  # filesystem is lost on the next `docker compose up --build`, which is the
  # quietest possible way to lose the evidence again.
  #
  # Empty turns it off: the reader still works, the app submits without an
  # evidence URL, and the startup log says so.
  scorecard-photos:
    dir: "${VSP_SCORECARD_PHOTO_DIR:}"

  corrections:
    # Golfers whose scorecards publish the moment they are submitted, by email,
    # comma-separated. Empty by default, and empty means every card is reviewed
    # in the portal exactly as before.
    #
    # The review step is there because a golfer typing eighteen stroke indexes
    # at the first tee is where numbers go wrong, and a wrong index misallocates
    # strokes for everyone who plays that card afterwards. That reasoning does
    # not describe the operator loading the country's cards from photographs:
    # they are the reviewer, so routing their own work into their own queue
    # checks nothing and costs a round trip per club.
    #
    # Nothing else is relaxed for them. Every check still runs, the correction
    # row is still written, and it still records who approved it and why — so
    # the audit trail reads the same as a card an admin clicked through, and
    # removing an address here puts that person straight back in the queue.
    trusted-reporters: "${VSP_CORRECTION_TRUSTED_REPORTERS:}"

  auth:
    social:
      clock-skew: ${VSP_SOCIAL_CLOCK_SKEW:PT1M}
      google:
        jwks-uri: "${VSP_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}"
        issuers: "${VSP_GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}"
        client-ids: "${VSP_GOOGLE_CLIENT_IDS:}"
      apple:
        jwks-uri: "${VSP_APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}"
        issuers: "${VSP_APPLE_ISSUERS:https://appleid.apple.com}"
        client-ids: "${VSP_APPLE_CLIENT_IDS:}"
      jwks:
        # Providers rotate on the order of days; an hour of cache keeps a
        # sign-in from depending on their endpoint being up at that instant.
        cache-ttl: ${VSP_JWKS_CACHE_TTL:PT1H}
        min-refresh-interval: ${VSP_JWKS_MIN_REFRESH:PT1M}
        request-timeout: ${VSP_JWKS_TIMEOUT:PT5S}
