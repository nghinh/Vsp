<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vietnam Smart Golf - GPS Glance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&amp;family=Fira+Code:wght@500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#EA580C",
                        "on-background": "#dae2fd",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#222a3d",
                        "inverse-primary": "#a73a00",
                        "on-tertiary": "#003825",
                        "primary-fixed-dim": "#ffb599",
                        "on-surface-variant": "#e2bfb2",
                        "background": "#000000",
                        "on-secondary-container": "#4a1c00",
                        "on-primary-container": "#4f1700",
                        "primary-container": "#f66018",
                        "surface-container-highest": "#2d3449",
                        "inverse-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary": "#552100",
                        "on-tertiary-fixed-variant": "#005137",
                        "surface-tint": "#ffb599",
                        "inverse-on-surface": "#283044",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#7f2b00",
                        "outline": "#a98a7e",
                        "on-primary": "#5a1c00",
                        "surface-container-lowest": "#060e20",
                        "primary-fixed": "#ffdbce",
                        "on-error": "#690005",
                        "outline-variant": "#5a4138",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed-dim": "#68dba9",
                        "on-tertiary-fixed": "#002114",
                        "surface-bright": "#31394d",
                        "surface-container": "#171f33",
                        "tertiary": "#68dba9",
                        "on-secondary-fixed": "#341100",
                        "on-surface": "#dae2fd",
                        "secondary": "#ffb690",
                        "secondary-fixed-dim": "#ffb690",
                        "on-secondary-fixed-variant": "#783200",
                        "on-tertiary-container": "#00311f",
                        "secondary-container": "#ec6a06",
                        "secondary-fixed": "#ffdbca",
                        "surface": "#000000",
                        "surface-container-low": "#131b2e",
                        "tertiary-container": "#25a475",
                        "on-primary-fixed": "#370e00",
                        "tertiary-fixed": "#85f8c4",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "display-metrics": ["Fira Code", "monospace"],
                        "metric-sm": ["Fira Code", "monospace"],
                        "body-md": ["Fira Sans", "sans-serif"],
                        "headline-lg": ["Fira Sans", "sans-serif"],
                        "body-lg": ["Fira Sans", "sans-serif"],
                        "headline-md": ["Fira Sans", "sans-serif"],
                        "label-caps": ["Fira Sans", "sans-serif"]
                    },
                }
            }
        }
    </script>
<style>
        body {
            background-color: black;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Fira Sans', sans-serif;
        }

        .watch-face {
            width: 454px;
            height: 454px;
            background-color: #000000;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid #1a1a1a;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
            user-select: none;
        }

        .safe-zone {
            position: absolute;
            top: 12%;
            left: 12%;
            right: 12%;
            bottom: 12%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .curved-text {
            fill: #ffffff;
            font-family: 'Fira Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .gps-pulse {
            animation: pulse-dot 2s infinite ease-in-out;
        }
        
        /* High contrast distance rendering */
        .primary-dist {
            text-shadow: 0 0 20px rgba(234, 88, 12, 0.4);
        }
    </style>
</head>
<body class="dark">
<div class="watch-face">
<!-- GPS Status (Top Right) -->
<div class="absolute top-[75px] right-[95px] flex items-center gap-2 z-30">
<span class="font-label-caps text-[11px] text-tertiary font-bold uppercase tracking-wider">GPS SẴN SÀNG</span>
<div class="w-2.5 h-2.5 bg-tertiary rounded-full gps-pulse"></div>
</div>
<!-- Curved Top Label (Hole Info) -->
<div class="absolute top-6 left-0 w-full flex justify-center z-10">
<svg class="w-full h-auto" viewbox="0 0 454 120">
<path d="M 107 90 A 150 150 0 0 1 347 90" fill="transparent" id="curve"></path>
<text class="curved-text">
<textpath href="#curve" startoffset="50%" text-anchor="middle">
                        Hố 7 · Par 4
                    </textpath>
</text>
</svg>
</div>
<!-- Main Content Area -->
<div class="safe-zone z-20">
<!-- Secondary Distances (Top Row) -->
<div class="flex justify-between w-full mt-10 px-4">
<div class="flex flex-col items-start">
<span class="text-on-surface-variant font-label-caps text-[12px] font-bold opacity-80 uppercase">TRƯỚC</span>
<span class="text-white font-display-metrics text-[36px] leading-tight font-bold">135</span>
</div>
<div class="flex flex-col items-end">
<span class="text-on-surface-variant font-label-caps text-[12px] font-bold opacity-80 uppercase">SAU</span>
<span class="text-white font-display-metrics text-[36px] leading-tight font-bold">154</span>
</div>
</div>
<!-- Primary Center Distance -->
<div class="flex flex-col items-center justify-center -mt-6">
<div class="relative flex items-baseline gap-2">
<span class="text-primary font-display-metrics text-[112px] leading-none tracking-tighter font-bold primary-dist">142</span>
<span class="text-primary font-display-metrics text-[24px] font-bold">YDS</span>
</div>
<div class="flex items-center gap-1.5 -mt-2">
<span class="material-symbols-outlined text-tertiary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-tertiary font-label-caps text-[13px] font-bold uppercase tracking-wide">Tâm hố chính thức</span>
</div>
</div>
<!-- Action Button (Bottom) -->
<button class="mb-2 bg-surface-container-highest active:bg-primary-container active:scale-95 transition-all duration-150 rounded-full py-2.5 px-8 flex items-center gap-2.5 border border-outline-variant/40 shadow-lg">
<span class="material-symbols-outlined text-secondary text-[20px]">edit_square</span>
<span class="text-on-surface font-headline-md text-[18px] font-semibold">Điểm +8</span>
</button>
</div>
<!-- Side Hazard Indicators -->
<div class="absolute left-6 top-1/2 -translate-y-1/2 flex flex-col gap-5 opacity-60">
<div class="w-2 h-8 bg-error rounded-full shadow-[0_0_8px_rgba(255,180,171,0.4)]"></div>
<div class="w-1.5 h-5 bg-outline rounded-full"></div>
<div class="w-1.5 h-5 bg-outline rounded-full"></div>
</div>
<div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-5 opacity-60 items-end">
<div class="w-2 h-8 bg-tertiary rounded-full shadow-[0_0_8px_rgba(104,219,169,0.4)]"></div>
<div class="w-1.5 h-5 bg-outline rounded-full"></div>
<div class="w-1.5 h-5 bg-outline rounded-full"></div>
</div>
</div>
<script>
        // Haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(25);
                }
            });
        });
    </script>
</body></html>
