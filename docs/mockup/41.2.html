<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Targets &amp; Hazards - Wear OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Fira+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1326; /* theme background */
            width: 454px;
            height: 454px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Circular mask for Wear OS simulation */
        .watch-frame {
            width: 454px;
            height: 454px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            background-color: #0b1326;
            border: 2px solid #171f33;
            display: flex;
            flex-direction: column;
        }

        .scroll-container {
            height: 100%;
            overflow-y: scroll;
            scrollbar-width: none; /* Hide scrollbar for Firefox */
            -ms-overflow-style: none; /* Hide scrollbar for IE/Edge */
            padding-top: 80px; /* Header space */
            padding-bottom: 100px; /* Bottom nav/safe area */
        }

        .scroll-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome/Safari */
        }

        .bezel-indicator {
            position: absolute;
            right: 4px;
            top: 25%;
            height: 50%;
            width: 3px;
            background: linear-gradient(to bottom, transparent, #ffb599, transparent);
            border-radius: 99px;
            opacity: 0.6;
        }

        .hazard-card {
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .hazard-card:active {
            transform: scale(0.95);
            background-color: #2d3449;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#dae2fd",
                      "on-error-container": "#ffdad6",
                      "surface-container-high": "#222a3d",
                      "inverse-primary": "#a73a00",
                      "on-tertiary": "#003825",
                      "primary-fixed-dim": "#ffb599",
                      "on-surface-variant": "#e2bfb2",
                      "background": "#0b1326",
                      "on-secondary-container": "#4a1c00",
                      "on-primary-container": "#4f1700",
                      "primary-container": "#f66018",
                      "surface-container-highest": "#2d3449",
                      "inverse-surface": "#dae2fd",
                      "surface-variant": "#2d3449",
                      "on-secondary": "#552100",
                      "on-tertiary-fixed-variant": "#005137",
                      "surface-tint": "#ffb599",
                      "inverse-on-surface": "#283044",
                      "error-container": "#93000a",
                      "on-primary-fixed-variant": "#7f2b00",
                      "outline": "#a98a7e",
                      "on-primary": "#5a1c00",
                      "surface-container-lowest": "#060e20",
                      "primary-fixed": "#ffdbce",
                      "on-error": "#690005",
                      "outline-variant": "#5a4138",
                      "surface-dim": "#0b1326",
                      "tertiary-fixed-dim": "#68dba9",
                      "on-tertiary-fixed": "#002114",
                      "surface-bright": "#31394d",
                      "surface-container": "#171f33",
                      "tertiary": "#68dba9",
                      "on-secondary-fixed": "#341100",
                      "on-surface": "#dae2fd",
                      "secondary": "#ffb690",
                      "secondary-fixed-dim": "#ffb690",
                      "on-secondary-fixed-variant": "#783200",
                      "on-tertiary-container": "#00311f",
                      "secondary-container": "#ec6a06",
                      "secondary-fixed": "#ffdbca",
                      "primary": "#ffb599",
                      "surface": "#0b1326",
                      "surface-container-low": "#131b2e",
                      "tertiary-container": "#25a475",
                      "on-primary-fixed": "#370e00",
                      "tertiary-fixed": "#85f8c4",
                      "error": "#ffb4ab"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "margin-desktop": "32px",
                      "unit": "8px",
                      "gutter": "16px",
                      "touch-target": "44px"
              },
              "fontFamily": {
                      "metric-sm": ["Fira Code"],
                      "body-md": ["Fira Sans"],
                      "headline-lg": ["Fira Sans"],
                      "display-metrics": ["Fira Code"],
                      "body-lg": ["Fira Sans"],
                      "headline-md": ["Fira Sans"],
                      "label-caps": ["Fira Sans"]
              },
              "fontSize": {
                      "metric-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                      "display-metrics": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-background">
<div class="watch-frame">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="fixed top-0 left-0 w-full z-50 flex flex-col items-center pt-8 pb-4 bg-background/80 backdrop-blur-md">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">gps_fixed</span>
<span class="font-headline-md text-headline-md text-on-surface">Hole 7</span>
</div>
<div class="flex items-center mt-1">
<div class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse mr-2"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Targets &amp; Hazards</span>
</div>
</header>
<!-- Scroll Indicator (Rotating Bezel hint) -->
<div class="bezel-indicator"></div>
<!-- Scrollable Content Canvas -->
<main class="scroll-container px-10">
<!-- Item 1: BUNKER CARRY -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden group">
<div class="absolute right-0 top-0 w-16 h-16 bg-primary-container/10 rounded-bl-full flex items-center justify-center translate-x-4 -translate-y-4">
<span class="material-symbols-outlined text-secondary-container mt-4 mr-4" style="font-variation-settings: 'FILL' 1;">sports_golf</span>
</div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-secondary-container text-body-md" style="font-variation-settings: 'FILL' 1;">error_outline</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">BUNKER CARRY</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-display-metrics text-display-metrics text-on-surface">185</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 bg-on-tertiary-fixed-variant rounded-full">
<span class="font-label-caps text-[10px] text-tertiary">CHÍNH THỨC</span>
</div>
</div>
<!-- Item 2: WATER FRONT -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden">
<div class="absolute right-0 top-0 w-16 h-16 bg-tertiary-container/10 rounded-bl-full flex items-center justify-center translate-x-4 -translate-y-4">
<span class="material-symbols-outlined text-tertiary mt-4 mr-4" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-secondary-container text-body-md" style="font-variation-settings: 'FILL' 1;">error_outline</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">WATER FRONT</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-display-metrics text-display-metrics text-on-surface">210</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 border border-tertiary rounded-full">
<span class="font-label-caps text-[10px] text-tertiary">ƯỚC TÍNH</span>
</div>
</div>
<!-- Item 3: OOB LEFT -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-error text-body-md" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">OOB LEFT</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-display-metrics text-display-metrics text-on-surface">245</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 bg-surface-container-highest rounded-full">
<span class="font-label-caps text-[10px] text-on-surface">CỘNG ĐỒNG</span>
</div>
</div>
<!-- Empty spacer for scroll logic -->
<div class="h-10"></div>
</main>
<!-- Bottom Tab Bar (Navigation Shell) -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-12 pb-6 pt-2 bg-gradient-to-t from-background to-transparent h-touch-target">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">sports_golf</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-2 scale-95">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">list_alt</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</footer>
<!-- Battery Status (Overlaid small detail) -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-1">
<span class="material-symbols-outlined text-on-surface-variant text-[12px]">battery_charging_full</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">85%</span>
</div>
</div>
<script>
        // Micro-interaction for bezel/scroll simulation
        const scrollContainer = document.querySelector('.scroll-container');
        const bezelIndicator = document.querySelector('.bezel-indicator');

        scrollContainer.addEventListener('scroll', () => {
            const scrollPercentage = scrollContainer.scrollTop / (scrollContainer.scrollHeight - scrollContainer.clientHeight);
            const moveY = scrollPercentage * 150; // Simple visual shift
            bezelIndicator.style.transform = `translateY(${moveY}px)`;
            bezelIndicator.style.opacity = '1';
            
            // Fade out indicator after some inactivity
            clearTimeout(window.bezelTimeout);
            window.bezelTimeout = setTimeout(() => {
                bezelIndicator.style.opacity = '0.6';
            }, 1000);
        });

        // Handle card interactions
        document.querySelectorAll('.hazard-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.classList.add('haptic-feedback-simulated');
            });
        });
    </script>
</body></html>
