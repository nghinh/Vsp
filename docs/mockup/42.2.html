<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mục tiêu &amp; Bẫy - Wear OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Fira+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#EA580C", // Vietnam Smart Golf Platform Primary Orange
                        "on-primary": "#FFFFFF",
                        "surface": "#0b1326",
                        "on-surface": "#dae2fd",
                        "surface-container": "#171f33",
                        "surface-container-high": "#222a3d",
                        "surface-container-highest": "#2d3449",
                        "on-surface-variant": "#e2bfb2",
                        "background": "#0b1326",
                        "tertiary": "#68dba9",
                        "on-tertiary-fixed-variant": "#005137",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "unit": "8px",
                        "gutter": "16px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {
                        "metric": ["Fira Code", "monospace"],
                        "ui": ["Fira Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "display-metrics": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "metric-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1326;
            width: 454px;
            height: 454px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Sans', sans-serif;
        }

        .watch-frame {
            width: 454px;
            height: 454px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            background-color: #0b1326;
            border: 2px solid #171f33;
            display: flex;
            flex-direction: column;
        }

        .scroll-container {
            height: 100%;
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-top: 84px;
            padding-bottom: 100px;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .bezel-indicator {
            position: absolute;
            right: 4px;
            top: 25%;
            height: 50%;
            width: 3px;
            background: linear-gradient(to bottom, transparent, #EA580C, transparent);
            border-radius: 99px;
            opacity: 0.6;
            z-index: 60;
        }

        .hazard-card {
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        .hazard-card:active {
            transform: scale(0.96);
            background-color: #2d3449;
        }

        .font-fira-code {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body class="bg-background">
<div class="watch-frame">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex flex-col items-center pt-8 pb-3 bg-background/90 backdrop-blur-md">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-ui text-headline-md text-on-surface">Hố 7</span>
</div>
<div class="flex items-center mt-0.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse mr-1.5"></div>
<span class="font-ui text-label-caps text-on-surface-variant uppercase">MỤC TIÊU &amp; BẪY</span>
</div>
</header>
<!-- Scroll Indicator -->
<div class="bezel-indicator"></div>
<!-- Content -->
<main class="scroll-container px-10">
<!-- Item 1: Bẫy Cát -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden">
<div class="absolute right-0 top-0 w-14 h-14 bg-primary/10 rounded-bl-3xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">sports_golf</span>
</div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">info</span>
<span class="font-ui text-label-caps text-on-surface-variant uppercase">VƯỢT BẪY CÁT</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-fira-code text-display-metrics text-on-surface">185</span>
<span class="font-fira-code text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 bg-tertiary/20 rounded-full border border-tertiary/30">
<span class="font-ui text-[10px] font-bold text-tertiary">CHÍNH THỨC</span>
</div>
</div>
<!-- Item 2: Bẫy Nước -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden">
<div class="absolute right-0 top-0 w-14 h-14 bg-primary/10 rounded-bl-3xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">info</span>
<span class="font-ui text-label-caps text-on-surface-variant uppercase">MẶT NƯỚC TRƯỚC</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-fira-code text-display-metrics text-on-surface">210</span>
<span class="font-fira-code text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 border border-on-surface-variant/30 rounded-full">
<span class="font-ui text-[10px] font-bold text-on-surface-variant">ƯỚC TÍNH</span>
</div>
</div>
<!-- Item 3: OOB -->
<div class="hazard-card bg-surface-container-high rounded-xl p-4 mb-3 border border-white/5 flex flex-col items-start relative overflow-hidden">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-error text-[16px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-ui text-label-caps text-on-surface-variant uppercase">OOB BÊN TRÁI</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-fira-code text-display-metrics text-on-surface">245</span>
<span class="font-fira-code text-metric-sm text-on-surface-variant">m</span>
</div>
<div class="mt-2 py-0.5 px-2 bg-surface-container-highest rounded-full border border-white/10">
<span class="font-ui text-[10px] font-bold text-on-surface-variant">CỘNG ĐỒNG</span>
</div>
</div>
<div class="h-12"></div>
</main>
<!-- Bottom Tab Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-end px-12 pb-6 pt-4 bg-gradient-to-t from-background via-background/90 to-transparent">
<button class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant rounded-full active:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[24px]">map</span>
</button>
<button class="w-[48px] h-[48px] flex items-center justify-center bg-primary text-on-primary rounded-full shadow-lg shadow-primary/20 scale-110">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">format_list_bulleted</span>
</button>
<button class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant rounded-full active:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</footer>
<!-- Battery Status -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 flex items-center gap-1 opacity-60">
<span class="material-symbols-outlined text-on-surface-variant text-[12px]">battery_5_bar</span>
<span class="font-fira-code text-[10px] text-on-surface-variant">85%</span>
</div>
</div>
<script>
        const scrollContainer = document.querySelector('.scroll-container');
        const bezelIndicator = document.querySelector('.bezel-indicator');

        scrollContainer.addEventListener('scroll', () => {
            const scrollPercentage = scrollContainer.scrollTop / (scrollContainer.scrollHeight - scrollContainer.clientHeight);
            const moveY = scrollPercentage * 150;
            bezelIndicator.style.transform = `translateY(${moveY}px)`;
            bezelIndicator.style.opacity = '1';
            
            clearTimeout(window.bezelTimeout);
            window.bezelTimeout = setTimeout(() => {
                bezelIndicator.style.opacity = '0.6';
            }, 800);
        });

        // Simple haptic visual feedback
        document.querySelectorAll('button, .hazard-card').forEach(el => {
            el.addEventListener('touchstart', () => {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
