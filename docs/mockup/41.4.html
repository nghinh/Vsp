<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System Status - Wear OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Fira+Code:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@100..900&family=Fira+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Load Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#dae2fd",
                    "on-error-container": "#ffdad6",
                    "surface-container-high": "#222a3d",
                    "inverse-primary": "#a73a00",
                    "on-tertiary": "#003825",
                    "primary-fixed-dim": "#ffb599",
                    "on-surface-variant": "#e2bfb2",
                    "background": "#0b1326",
                    "on-secondary-container": "#4a1c00",
                    "on-primary-container": "#4f1700",
                    "primary-container": "#f66018",
                    "surface-container-highest": "#2d3449",
                    "inverse-surface": "#dae2fd",
                    "surface-variant": "#2d3449",
                    "on-secondary": "#552100",
                    "on-tertiary-fixed-variant": "#005137",
                    "surface-tint": "#ffb599",
                    "inverse-on-surface": "#283044",
                    "error-container": "#93000a",
                    "on-primary-fixed-variant": "#7f2b00",
                    "outline": "#a98a7e",
                    "on-primary": "#5a1c00",
                    "surface-container-lowest": "#060e20",
                    "primary-fixed": "#ffdbce",
                    "on-error": "#690005",
                    "outline-variant": "#5a4138",
                    "surface-dim": "#0b1326",
                    "tertiary-fixed-dim": "#68dba9",
                    "on-tertiary-fixed": "#002114",
                    "surface-bright": "#31394d",
                    "surface-container": "#171f33",
                    "tertiary": "#68dba9",
                    "on-secondary-fixed": "#341100",
                    "on-surface": "#dae2fd",
                    "secondary": "#ffb690",
                    "secondary-fixed-dim": "#ffb690",
                    "on-secondary-fixed-variant": "#783200",
                    "on-tertiary-container": "#00311f",
                    "secondary-container": "#ec6a06",
                    "secondary-fixed": "#ffdbca",
                    "primary": "#ffb599",
                    "surface": "#0b1326",
                    "surface-container-low": "#131b2e",
                    "tertiary-container": "#25a475",
                    "on-primary-fixed": "#370e00",
                    "tertiary-fixed": "#85f8c4",
                    "error": "#ffb4ab"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "unit": "8px",
                    "gutter": "16px",
                    "touch-target": "44px"
            },
            "fontFamily": {
                    "metric-sm": ["Fira Code"],
                    "body-md": ["Fira Sans"],
                    "headline-lg": ["Fira Sans"],
                    "display-metrics": ["Fira Code"],
                    "body-lg": ["Fira Sans"],
                    "headline-md": ["Fira Sans"],
                    "label-caps": ["Fira Sans"]
            },
            "fontSize": {
                    "metric-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-metrics": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color-scheme: dark;
        }

        /* Circular Watch Frame Simulation */
        .watch-face {
            width: 454px;
            height: 454px;
            border-radius: 50%;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border: 2px solid #1a1a1a;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .status-row {
            transition: transform 0.2s ease;
        }

        .status-row:active {
            transform: scale(0.95);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Custom animation for the GPS icon */
        @keyframes pulse-green {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .pulse-icon {
            animation: pulse-green 2s infinite ease-in-out;
        }

        .dim-layer {
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="dark">
<!-- Watch Canvas -->
<div class="watch-face relative">
<!-- Header / Time Placeholder -->
<div class="absolute top-8 w-full flex justify-center">
<span class="font-metric-sm text-metric-sm text-on-surface-variant tracking-widest opacity-60">10:45 AM</span>
</div>
<!-- Main Content Area -->
<div class="flex flex-col gap-4 w-full items-center">
<!-- GPS Status Row -->
<div class="status-row flex items-center justify-start bg-surface-container-low/50 rounded-full py-3 px-6 w-[85%] border border-outline-variant/10">
<div class="w-10 h-10 flex items-center justify-center bg-tertiary-container/20 rounded-full mr-4 pulse-icon">
<span class="material-symbols-outlined text-tertiary text-2xl" data-icon="gps_fixed">gps_fixed</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-tertiary">GPS READY</span>
<span class="font-metric-sm text-[10px] text-on-surface-variant">ACCURACY: 2.4M</span>
</div>
</div>
<!-- Connection Status Row -->
<div class="status-row flex items-center justify-start bg-surface-container-low/50 rounded-full py-3 px-6 w-[92%] border border-outline-variant/10">
<div class="w-10 h-10 flex items-center justify-center bg-error-container/20 rounded-full mr-4">
<span class="material-symbols-outlined text-error text-2xl" data-icon="cloud_off">cloud_off</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-error">OFFLINE</span>
<span class="font-metric-sm text-[10px] text-on-surface-variant">LOCAL CACHE ACTIVE</span>
</div>
</div>
<!-- Battery Status Row -->
<div class="status-row flex items-center justify-start bg-surface-container-low/50 rounded-full py-3 px-6 w-[85%] border border-outline-variant/10">
<div class="w-10 h-10 flex items-center justify-center bg-primary-container/20 rounded-full mr-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="battery_charging_full" style="font-variation-settings: 'FILL' 1;">battery_charging_full</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-primary">BATTERY 82%</span>
<span class="font-metric-sm text-[10px] text-on-surface-variant">CHARGING • 45m TO FULL</span>
</div>
</div>
</div>
<!-- Action Area (Dim Mode Toggle) -->
<div class="absolute bottom-10 flex flex-col items-center gap-2">
<button class="group flex flex-col items-center justify-center p-3 rounded-full bg-surface-container-highest active:scale-90 transition-transform" id="dimToggle">
<span class="material-symbols-outlined text-on-surface text-2xl" data-icon="brightness_medium" id="dimIcon">brightness_medium</span>
<span class="font-label-caps text-[10px] text-on-surface-variant mt-1">DIM MODE</span>
</button>
</div>
<!-- Decorative Curvature Border -->
<div class="absolute inset-0 pointer-events-none rounded-full border-[12px] border-black opacity-20"></div>
<!-- Screen Overlay for Dim Mode -->
<div class="dim-layer absolute inset-0 bg-black opacity-0" id="dimOverlay"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        const dimToggle = document.getElementById('dimToggle');
        const dimOverlay = document.getElementById('dimOverlay');
        const dimIcon = document.getElementById('dimIcon');
        let isDimmed = false;

        dimToggle.addEventListener('click', () => {
            isDimmed = !isDimmed;
            
            if (isDimmed) {
                dimOverlay.style.opacity = '0.75';
                dimIcon.innerText = 'brightness_low';
                dimToggle.classList.add('bg-primary-container');
                dimToggle.classList.remove('bg-surface-container-highest');
            } else {
                dimOverlay.style.opacity = '0';
                dimIcon.innerText = 'brightness_medium';
                dimToggle.classList.remove('bg-primary-container');
                dimToggle.classList.add('bg-surface-container-highest');
            }
            
            // Simulate haptic feedback
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        });

        // Ambient rotation or minor animation could be added here for GPS testing
    </script>
</body></html>
