<!DOCTYPE html>

<html class="dark" lang="en"><head>

            "colors": {

                    "background": "#0b1326",

                    "primary-fixed": "#ffdbce",
                    "outline-variant": "#5a4138",
                    "on-primary-container": "#4f1700",
                    "surface-variant": "#2d3449",
                    "surface-container-lowest": "#060e20",
                    "surface-bright": "#31394d",
                    "inverse-surface": "#dae2fd",
                    "primary-container": "#f66018",
                    "on-primary-fixed": "#370e00",
                    "error": "#ffb4ab",
                    "surface-container-low": "#131b2e",
                    "surface": "#0b1326",
                    "error-container": "#93000a",
                    "on-secondary-fixed": "#341100",
                    "on-tertiary-fixed-variant": "#005137",
                    "primary-fixed-dim": "#ffb599",
                    "secondary-fixed-dim": "#ffb690",
                    "inverse-on-surface": "#283044",
                    "inverse-primary": "#a73a00",
                    "on-tertiary-container": "#00311f",
                    "tertiary-fixed": "#85f8c4",
                    "on-tertiary-fixed": "#002114",
                    "on-primary-fixed-variant": "#7f2b00",
                    "on-surface-variant": "#e2bfb2",
                    "on-secondary": "#552100",
                    "on-error-container": "#ffdad6",
                    "secondary": "#ffb690",
                    "on-secondary-container": "#4a1c00",
                    "on-background": "#dae2fd",
                    "secondary-container": "#ec6a06",
                    "surface-container-high": "#222a3d",
                    "secondary-fixed": "#ffdbca",
                    "on-tertiary": "#003825",
                    "on-surface": "#dae2fd",
                    "on-primary": "#5a1c00",
                    "primary": "#ffb599",
                    "tertiary": "#68dba9",
                    "tertiary-container": "#25a475",
                    "surface-container": "#171f33",
                    "surface-dim": "#0b1326",
                    "outline": "#a98a7e",
                    "on-error": "#690005",
                    "surface-tint": "#ffb599"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "touch-target": "44px",
                    "margin-mobile": "16px",
                    "unit": "8px",
                    "gutter": "16px",
                    "margin-desktop": "32px"
            },
            "fontFamily": {
                    "headline-md": ["Fira Sans"],
                    "body-md": ["Fira Sans"],
                    "headline-lg": ["Fira Sans"],
                    "display-metrics": ["Fira Code"],
                    "body-lg": ["Fira Sans"],
                    "metric-sm": ["Fira Code"],
                    "label-caps": ["Fira Sans"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-metrics": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "metric-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Apple Watch 45mm Frame Simulation */
        .watch-container {
            width: 396px;
            height: 484px;
            background: #000;
            border-radius: 60px;
            position: relative;
            box-shadow: 0 0 0 4px #1a1a1a, 0 0 40px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 8px solid #000;
        }

        .haptic-feedback-simulated:active {
            transform: scale(0.95);
            transition: transform 0.1s cubic-bezier(0.1, 0, 0, 1);
        }

        @keyframes crown-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rotate-crown {
            animation: crown-rotate 4s linear infinite;
        }
    </style>
</head>
<body class="bg-surface-container-lowest flex items-center justify-center min-h-screen p-4">
<!-- Apple Watch Container -->
<div class="watch-container flex flex-col items-center justify-between p-4 selection:bg-none">
<!-- TopAppBar (Shared Component Implementation) -->
<header class="flex justify-between items-center w-full px-2 h-touch-target bg-background">
<div class="flex items-center gap-1 scale-95 active:scale-90 transition-transform hover:opacity-80">
<span class="material-symbols-outlined text-primary font-headline-md text-headline-md" style="font-variation-settings: 'FILL' 1;">gps_fixed</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Hole 14</h1>
<div class="flex items-center scale-95 active:scale-90 transition-transform hover:opacity-80">
<span class="material-symbols-outlined text-primary font-headline-md text-headline-md">battery_charging_full</span>
</div>
</header>
<!-- Main Scoring Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-center space-y-6">
<!-- Information Pill -->
<div class="bg-surface-container-high px-4 py-1 rounded-full border border-outline-variant flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">PAR 4</span>
</div>
<!-- Large Numeric Stepper Section -->
<div class="w-full flex items-center justify-between px-2">
<!-- Minus Button -->
<button class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface haptic-feedback-simulated transition-all active:bg-surface-bright" onclick="decrement()">
<span class="material-symbols-outlined text-3xl">remove</span>
</button>
<!-- Value Display with Digital Crown Hint -->
<div class="relative flex flex-col items-center">
<div class="flex items-center gap-3">
<span class="font-display-metrics text-[80px] leading-none text-primary-container" id="stroke-value">4</span>
<!-- Digital Crown Indicator -->
<div class="flex flex-col items-center gap-1 opacity-60">
<span class="material-symbols-outlined rotate-crown text-on-surface-variant">motion_sensor_active</span>
<span class="text-[8px] font-label-caps text-on-surface-variant">CROWN</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest -mt-2">STROKES</span>
</div>
<!-- Plus Button -->
<button class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface haptic-feedback-simulated transition-all active:bg-surface-bright" onclick="increment()">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<!-- Hazard Status Indicator -->
<div class="flex gap-4">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-error text-[16px]">waves</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">128y</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-secondary text-[16px]">grid_view</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">42y</span>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="w-full px-2 pb-2">
<button class="w-full h-14 bg-tertiary-container hover:bg-tertiary-fixed-dim text-on-tertiary-container font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 haptic-feedback-simulated transition-all active:scale-95 shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Confirm & Next
            </button>
</footer>
<!-- BottomNavBar (Hidden in specific transactional state, but defined in JSON) -->
<!-- Suppressed as per "The Destination Rule" for Transactional Focused screens -->
</div>
<!-- Micro-interactions Script -->
<script>
        let strokes = 4;
        const display = document.getElementById('stroke-value');

        function updateDisplay() {
            display.innerText = strokes;
            // Visual feedback for change
            display.classList.add('scale-110');
            setTimeout(() => display.classList.remove('scale-110'), 100);
        }

        function increment() {
            if(strokes < 15) {
                strokes++;
                updateDisplay();
                // Apple Watch Haptic Simulation via scale/opacity
            }
        }

        function decrement() {
            if(strokes > 1) {
                strokes--;
                updateDisplay();
            }
        }

        // Simulate Digital Crown via mouse wheel
        window.addEventListener('wheel', (e) => {
            if(e.deltaY < 0) increment();
            else decrement();
        });
    </script>
<!-- Custom Elements for Animations if required -->
<!-- Not needed for this specific UI, but prepared for systemic requirements -->
</body></html>
