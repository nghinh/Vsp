<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Golf GPS Glance View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&amp;family=Fira+Code:wght@500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@100..900&amp;family=Fira+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#dae2fd",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#222a3d",
                        "inverse-primary": "#a73a00",
                        "on-tertiary": "#003825",
                        "primary-fixed-dim": "#ffb599",
                        "on-surface-variant": "#e2bfb2",
                        "background": "#000000", /* True OLED Black for Wear OS */
                        "on-secondary-container": "#4a1c00",
                        "on-primary-container": "#4f1700",
                        "primary-container": "#f66018",
                        "surface-container-highest": "#2d3449",
                        "inverse-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary": "#552100",
                        "on-tertiary-fixed-variant": "#005137",
                        "surface-tint": "#ffb599",
                        "inverse-on-surface": "#283044",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#7f2b00",
                        "outline": "#a98a7e",
                        "on-primary": "#5a1c00",
                        "surface-container-lowest": "#060e20",
                        "primary-fixed": "#ffdbce",
                        "on-error": "#690005",
                        "outline-variant": "#5a4138",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed-dim": "#68dba9",
                        "on-tertiary-fixed": "#002114",
                        "surface-bright": "#31394d",
                        "surface-container": "#171f33",
                        "tertiary": "#68dba9",
                        "on-secondary-fixed": "#341100",
                        "on-surface": "#dae2fd",
                        "secondary": "#ffb690",
                        "secondary-fixed-dim": "#ffb690",
                        "on-secondary-fixed-variant": "#783200",
                        "on-tertiary-container": "#00311f",
                        "secondary-container": "#ec6a06",
                        "secondary-fixed": "#ffdbca",
                        "primary": "#EA580C", /* Overridden for prompt accuracy */
                        "surface": "#000000",
                        "surface-container-low": "#131b2e",
                        "tertiary-container": "#25a475",
                        "on-primary-fixed": "#370e00",
                        "tertiary-fixed": "#85f8c4",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "metric-sm": ["Fira Code"],
                        "body-md": ["Fira Sans"],
                        "headline-lg": ["Fira Sans"],
                        "display-metrics": ["Fira Code"],
                        "body-lg": ["Fira Sans"],
                        "headline-md": ["Fira Sans"],
                        "label-caps": ["Fira Sans"]
                    },
                }
            }
        }
    </script>
<style>
        body {
            background-color: black;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Fira Sans', sans-serif;
        }

        .watch-face {
            width: 454px;
            height: 454px;
            background-color: #000000;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 2px solid #1a1a1a;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            user-select: none;
        }

        .safe-zone {
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .curved-text {
            fill: #dae2fd;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .gps-pulse {
            animation: pulse-dot 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="dark">
<div class="watch-face">
<!-- Background Animation Layer (Subtle Map Contour) -->
<div class="absolute inset-0 opacity-20 pointer-events-none">

</div>
<!-- GPS Ready Status (Top Right Arc) -->
<div class="absolute top-16 right-20 flex items-center gap-2 z-20">
<span class="font-label-caps text-[10px] text-tertiary uppercase tracking-widest">GPS READY</span>
<div class="w-3 h-3 bg-tertiary rounded-full gps-pulse shadow-[0_0_8px_rgba(104,219,169,0.6)]"></div>
</div>
<!-- Curved Top Label -->
<div class="absolute top-4 left-0 w-full flex justify-center z-10">
<svg class="w-full h-auto" viewbox="0 0 454 100">
<path d="M 127 70 A 130 130 0 0 1 327 70" fill="transparent" id="curve"></path>
<text class="curved-text">
<textpath href="#curve" startoffset="50%" text-anchor="middle">
                        Hole 7 · Par 4
                    </textpath>
</text>
</svg>
</div>
<!-- Main Content Area (Safe Zone) -->
<div class="safe-zone z-20">
<!-- Secondary Distances (Top Row) -->
<div class="flex justify-between w-full mt-12 px-6">
<div class="flex flex-col items-start">
<span class="text-on-surface-variant font-label-caps text-[12px] opacity-70">FRONT</span>
<span class="text-white font-display-metrics text-[32px] leading-tight">135</span>
</div>
<div class="flex flex-col items-end">
<span class="text-on-surface-variant font-label-caps text-[12px] opacity-70">BACK</span>
<span class="text-white font-display-metrics text-[32px] leading-tight">154</span>
</div>
</div>
<!-- Massive Primary Distance -->
<div class="flex flex-col items-center justify-center -mt-4">
<div class="relative flex items-baseline gap-2">
<span class="text-primary font-display-metrics text-[100px] leading-none tracking-tighter drop-shadow-[0_4px_10px_rgba(234,88,12,0.3)]">142</span>
<span class="text-primary font-metric-sm text-[20px] font-bold">YDS</span>
</div>
<div class="flex items-center gap-1 -mt-2">
<span class="material-symbols-outlined text-tertiary text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-tertiary font-metric-sm text-[12px] uppercase">Official Center</span>
</div>
</div>
<!-- Interactive Action Button (Bottom) -->
<button class="mb-4 bg-surface-container-highest hover:bg-primary-container active:scale-95 transition-all duration-150 rounded-full py-2 px-6 flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-[18px]">edit_note</span>
<span class="text-on-surface font-headline-md text-[18px]">Score +8</span>
</button>
</div>
<!-- Side Indicators (Hazard Ticks) -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 opacity-40">
<div class="w-1.5 h-6 bg-error rounded-full"></div>
<div class="w-1 h-4 bg-outline rounded-full"></div>
<div class="w-1 h-4 bg-outline rounded-full"></div>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 opacity-40 items-end">
<div class="w-1.5 h-6 bg-tertiary rounded-full"></div>
<div class="w-1 h-4 bg-outline rounded-full"></div>
<div class="w-1 h-4 bg-outline rounded-full"></div>
</div>
</div>
<script>
        // Micro-interaction for haptic simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(20);
                }
            });
        });

        // Simple animation to shift the shader based on "GPS movement"
        const shader = document.querySelector('webgl-shader');
        if (shader) {
            let offset = 0;
            setInterval(() => {
                offset += 0.001;
                shader.style.transform = `scale(1.2) translate(${Math.sin(offset)*5}px, ${Math.cos(offset)*5}px)`;
            }, 50);
        }
    </script>
</body></html>
