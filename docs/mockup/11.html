<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Vietnam Smart Golf - Nhập điểm nhanh</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ffb599",
                    "on-primary-container": "#4f1700",
                    "inverse-primary": "#a73a00",
                    "tertiary": "#68dba9",
                    "on-tertiary-container": "#00311f",
                    "inverse-surface": "#dae2fd",
                    "error-container": "#93000a",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#370e00",
                    "outline": "#a98a7e",
                    "secondary-fixed": "#ffdbca",
                    "surface-tint": "#ffb599",
                    "secondary": "#ffb690",
                    "on-tertiary-fixed": "#002114",
                    "outline-variant": "#5a4138",
                    "on-tertiary-fixed-variant": "#005137",
                    "surface-container": "#171f33",
                    "surface-container-highest": "#2d3449",
                    "tertiary-fixed": "#85f8c4",
                    "primary-container": "#f66018",
                    "surface-container-lowest": "#060e20",
                    "tertiary-container": "#25a475",
                    "secondary-fixed-dim": "#ffb690",
                    "on-primary-fixed-variant": "#7f2b00",
                    "on-error": "#690005",
                    "on-primary": "#5a1c00",
                    "surface-container-high": "#222a3d",
                    "background": "#0b1326",
                    "inverse-on-surface": "#283044",
                    "on-background": "#dae2fd",
                    "surface": "#0b1326",
                    "on-secondary-fixed-variant": "#783200",
                    "on-surface": "#dae2fd",
                    "on-tertiary": "#003825",
                    "primary-fixed": "#ffdbce",
                    "surface-dim": "#0b1326",
                    "on-secondary-container": "#4a1c00",
                    "on-secondary-fixed": "#341100",
                    "surface-container-low": "#131b2e",
                    "surface-bright": "#31394d",
                    "secondary-container": "#ec6a06",
                    "on-surface-variant": "#e2bfb2",
                    "error": "#ffb4ab",
                    "tertiary-fixed-dim": "#68dba9",
                    "on-secondary": "#552100",
                    "primary-fixed-dim": "#ffb599",
                    "surface-variant": "#2d3449"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "touch-target": "44px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "unit": "8px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "body-md": ["Fira Sans"],
                    "body-lg": ["Fira Sans"],
                    "label-caps": ["Fira Sans"],
                    "headline-md": ["Fira Sans"],
                    "display-metrics": ["Fira Code"],
                    "metric-sm": ["Fira Code"],
                    "headline-lg": ["Fira Sans"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-metrics": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "metric-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .score-circle {
            border: 2px solid #68dba9;
            border-radius: 9999px;
        }
        .score-square {
            border: 2px solid #ffb4ab;
        }
        .score-double-circle {
            border: 4px double #68dba9;
            border-radius: 9999px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .active-pill {
            background-color: #ec6a06;
            color: #ffffff;
        }
    </style>
</head>
<body class="font-body-md text-body-md overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-[rgba(255,255,255,0.08)] px-margin-mobile h-touch-target flex items-center justify-between">
<button class="text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Hố 7 · Par 4</h1>
<button class="text-on-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<button class="text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content Area -->
<main class="pt-16 pb-32 px-margin-mobile flex flex-col gap-4">
<!-- Persistence Status -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant/60 py-1">
<span class="material-symbols-outlined text-[16px]">cloud_done</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest">Đã lưu ngoại tuyến · 17:42</span>
</div>
<!-- Golfer Cards Container -->
<div class="flex flex-col gap-3">
<!-- Golfer 1: Nghi -->
<div class="bg-surface-container rounded-xl p-4 border border-[rgba(255,255,255,0.08)] flex flex-col gap-3 transition-all duration-300" id="card-1">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-bold text-on-surface">Nghi</span>
<span class="font-metric-sm text-metric-sm text-on-surface-variant">HCP: <span class="font-display-metrics">22.9</span></span>
</div>
<div class="flex items-center gap-1 bg-tertiary-container/20 px-3 py-1 rounded-full border border-tertiary-container/30">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">circle</span>
<span class="font-label-caps text-tertiary">BIRDIE</span>
</div>
</div>
<div class="flex items-center justify-between gap-4">
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-surface-container-highest text-primary active:scale-90 transition-all border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<div class="relative flex items-center justify-center w-24 h-24">
<div class="absolute inset-0 score-circle scale-110 opacity-80"></div>
<span class="font-display-metrics text-display-metrics text-white">3</span>
</div>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-secondary-container text-white active:scale-90 transition-all shadow-lg">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
<button class="flex items-center justify-center gap-2 py-2 text-on-surface-variant hover:text-primary transition-colors" onclick="toggleStats('stats-1')">
<span class="font-label-caps text-label-caps">THÊM THỐNG KÊ</span>
<span class="material-symbols-outlined transition-transform duration-300" id="chevron-1">expand_more</span>
</button>
<!-- Hidden Stats Section -->
<div class="hidden flex flex-col gap-4 pt-2 border-t border-[rgba(255,255,255,0.05)] overflow-hidden" id="stats-1">
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold text-on-surface-variant uppercase ml-1">Số gậy Putt</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-1 border border-outline-variant">
<button class="flex-1 h-8 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-sm">remove</span></button>
<span class="flex-1 text-center font-display-metrics text-lg">2</span>
<button class="flex-1 h-8 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-sm">add</span></button>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold text-on-surface-variant uppercase ml-1">Phạt (Penalty)</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-1 border border-outline-variant">
<button class="flex-1 h-8 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-sm">remove</span></button>
<span class="flex-1 text-center font-display-metrics text-lg">0</span>
<button class="flex-1 h-8 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-sm">add</span></button>
</div>
</div>
</div>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-caps font-label-caps active-pill">FAIRWAY</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-caps font-label-caps">GIR</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-caps font-label-caps">BUNKER</button>
</div>
<textarea class="bg-surface-container-low border border-outline-variant rounded-lg p-3 text-body-md text-on-surface focus:border-primary focus:ring-0 placeholder:text-outline-variant h-20 resize-none" placeholder="Ghi chú hố..."></textarea>
</div>
</div>
<!-- Golfer 2: Minh -->
<div class="bg-surface-container rounded-xl p-4 border border-[rgba(255,255,255,0.08)] flex flex-col gap-3" id="card-2">
<div class="flex justify-between items-center">
<span class="font-bold text-on-surface">Minh</span>
<div class="flex items-center gap-1 bg-surface-bright px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant text-sm">circle</span>
<span class="font-label-caps text-on-surface-variant">PAR</span>
</div>
</div>
<div class="flex items-center justify-between gap-4">
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-surface-container-highest text-primary active:scale-90 transition-all border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<span class="font-display-metrics text-display-metrics text-white">4</span>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-secondary-container text-white active:scale-90 transition-all">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
</div>
<!-- Golfer 3: Dương -->
<div class="bg-surface-container rounded-xl p-4 border border-[rgba(255,255,255,0.08)] flex flex-col gap-3" id="card-3">
<div class="flex justify-between items-center">
<span class="font-bold text-on-surface">Dương</span>
<div class="flex items-center gap-1 bg-error-container/20 px-3 py-1 rounded-full border border-error-container/30">
<span class="material-symbols-outlined text-error text-sm">square</span>
<span class="font-label-caps text-error">BOGEY</span>
</div>
</div>
<div class="flex items-center justify-between gap-4">
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-surface-container-highest text-primary active:scale-90 transition-all border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<div class="relative flex items-center justify-center w-16 h-16">
<div class="absolute inset-0 score-square opacity-80"></div>
<span class="font-display-metrics text-display-metrics text-white">5</span>
</div>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-secondary-container text-white active:scale-90 transition-all">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
</div>
<!-- Golfer 4: Giang (Invalid State Example) -->
<div class="bg-surface-container rounded-xl p-4 border-2 border-error flex flex-col gap-3" id="card-4">
<div class="flex justify-between items-center">
<span class="font-bold text-on-surface">Giang</span>
<div class="flex items-center gap-1">
<span class="font-label-caps text-error">GIÁ TRỊ KHÔNG HỢP LỆ</span>
</div>
</div>
<div class="flex items-center justify-between gap-4">
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-surface-container-highest text-primary active:scale-90 transition-all border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<span class="font-display-metrics text-display-metrics text-error">0</span>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-secondary-container text-white active:scale-90 transition-all">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
<p class="text-[12px] text-error">Điểm gậy tối thiểu cho Par 4 phải từ 1 trở lên.</p>
</div>
</div>
</main>
<!-- Undo Toast Notification (Hidden by default) -->
<div class="fixed bottom-36 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full flex items-center gap-4 shadow-xl z-[100] transform translate-y-24 transition-transform duration-300 opacity-0 pointer-events-none" id="undo-toast">
<span class="font-body-md whitespace-nowrap">Đã cập nhật điểm cho Nghi</span>
<button class="font-bold text-primary px-2 py-1 uppercase tracking-wider text-sm active:opacity-50">Hoàn tác</button>
</div>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-16 left-0 w-full px-margin-mobile py-4 bg-gradient-to-t from-background via-background/90 to-transparent z-[40]">
<button class="w-full bg-secondary-container hover:bg-primary-container text-white font-bold h-[56px] rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-lg">
<span>LƯU &amp; SANG HỐ 8</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Navigation Shell (BottomNavBar) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-[64px] bg-surface-container-low px-2 z-50 border-t border-[rgba(255,255,255,0.08)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-caps text-label-caps mt-1">Sân golf</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined">map</span>
<span class="font-label-caps text-label-caps mt-1">Bản đồ</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">markdown_copy</span>
<span class="font-label-caps text-label-caps mt-1">Bảng điểm</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">Cá nhân</span>
</div>
</nav>
<script>
        function toggleStats(id) {
            const stats = document.getElementById(id);
            const cardId = id.split('-')[1];
            const chevron = document.getElementById('chevron-' + cardId);
            
            if (stats.classList.contains('hidden')) {
                stats.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
                showToast(); // Simulate interaction feedback
            } else {
                stats.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function showToast() {
            const toast = document.getElementById('undo-toast');
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-24');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-24');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        // Simple button press micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });
    </script>
</body></html>
