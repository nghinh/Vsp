<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Quick Score - Wear OS</title>

<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@100..900&family=Fira+Sans:wght@100..900&display=swap" rel="stylesheet"/>

                "background": "#0b1326",
                "on-secondary-container": "#4a1c00",
                "on-primary-container": "#4f1700",
                "primary-container": "#f66018",
                "surface-container-highest": "#2d3449",
                "inverse-surface": "#dae2fd",
                "surface-variant": "#2d3449",
                "on-secondary": "#552100",
                "on-tertiary-fixed-variant": "#005137",
                "surface-tint": "#ffb599",
                "inverse-on-surface": "#283044",
                "error-container": "#93000a",
                "on-primary-fixed-variant": "#7f2b00",
                "outline": "#a98a7e",
                "on-primary": "#5a1c00",

                "primary-fixed": "#ffdbce",

                "tertiary-fixed-dim": "#68dba9",

                "surface-bright": "#31394d",
                "surface-container": "#171f33",
                "tertiary": "#68dba9",
                "on-secondary-fixed": "#341100",
                "on-surface": "#dae2fd",
                "secondary": "#ffb690",
                "secondary-fixed-dim": "#ffb690",
                "on-secondary-fixed-variant": "#783200",
                "on-tertiary-container": "#00311f",
                "secondary-container": "#ec6a06",
                "secondary-fixed": "#ffdbca",
                "primary": "#ffb599",
                "surface": "#0b1326",
                "surface-container-low": "#131b2e",
                "tertiary-container": "#25a475",
                "on-primary-fixed": "#370e00",
                "tertiary-fixed": "#85f8c4",
                "error": "#ffb4ab"
            },
            "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",

            },
            "spacing": {
                "margin-mobile": "16px",
                "margin-desktop": "32px",
                "unit": "8px",

            },
            "fontFamily": {
                "metric-sm": ["Fira Code"],
                "body-md": ["Fira Sans"],

<style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Fira Sans', sans-serif;
        }
        .watch-face {
            width: 454px;
            height: 454px;
            background-color: #000;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 2px solid #1a1a1a;
            box-shadow: inset 0 0 20px rgba(255, 181, 153, 0.05);
        }
        .crown-indicator {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #ffb599, transparent);
            border-radius: 4px;
            opacity: 0.6;
            animation: pulse-indicator 2s infinite ease-in-out;
        }
        @keyframes pulse-indicator {
            0%, 100% { opacity: 0.3; height: 100px; }
            50% { opacity: 0.8; height: 140px; }
        }
        .confirm-btn-arc {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 100px;
            background-color: #25a475;
            border-radius: 50% 50% 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .confirm-btn-arc:active {
            background-color: #1e845e;
            transform: translateX(-50%) scale(0.98);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .bezel-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 40px;
            text-transform: uppercase;
        }
        .interaction-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 181, 153, 0.2);
            transform: scale(0);
            animation: ripple 0.6s linear;
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body class="dark">
<div class="watch-face flex flex-col items-center justify-center p-8 select-none">
<!-- Top App Bar Logic (Hole Info) -->
<div class="bezel-text z-10">
<span class="font-headline-md text-headline-md text-on-background tracking-widest">Hole 7</span>
</div>
<!-- Digital Crown Visual Indicator -->
<div class="crown-indicator"></div>
<!-- Main Score Canvas -->
<div class="relative w-full flex items-center justify-between px-4 mt-4">
<!-- Decrement Button -->
<button class="w-16 h-16 rounded-full flex items-center justify-center bg-surface-container-highest text-on-surface hover:bg-surface-variant transition-transform active:scale-90" onclick="changeScore(-1)">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<!-- Score Display -->
<div class="flex flex-col items-center">
<div class="font-display-metrics text-[120px] leading-none text-primary transition-all duration-200" id="score-digit">4</div>
<div class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.2em] -mt-2">STROKES</div>
</div>
<!-- Increment Button -->
<button class="w-16 h-16 rounded-full flex items-center justify-center bg-surface-container-highest text-on-surface hover:bg-surface-variant transition-transform active:scale-90" onclick="changeScore(1)">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
<!-- Confident Badging / Context -->
<div class="mt-4 flex items-center gap-2">
<div class="px-3 py-1 rounded-full bg-tertiary/10 border border-tertiary/30 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] text-tertiary" style="font-variation-settings: 'FILL' 1;">gps_fixed</span>
<span class="font-metric-sm text-metric-sm text-tertiary">GPS Active</span>
</div>
</div>
<!-- Bottom Action Bar (Confirm Button) -->
<div class="confirm-btn-arc" onclick="handleConfirm()">
<span class="font-headline-md text-headline-md text-on-tertiary tracking-tight uppercase">Confirm</span>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        let currentScore = 4;
        const scoreDisplay = document.getElementById('score-digit');

        function changeScore(delta) {
            currentScore += delta;
            if (currentScore < 1) currentScore = 1;
            if (currentScore > 99) currentScore = 99;
            
            // Animation effect
            scoreDisplay.style.transform = 'scale(1.1)';
            scoreDisplay.textContent = currentScore;
            
            setTimeout(() => {
                scoreDisplay.style.transform = 'scale(1)';
            }, 100);

            // Simulate haptic feedback for Wear OS
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function handleConfirm() {
            // Flash effect for confirmation
            const watchFace = document.querySelector('.watch-face');
            const originalBorder = watchFace.style.borderColor;
            watchFace.style.borderColor = '#25a475';
            
            if ('vibrate' in navigator) {
                navigator.vibrate([30, 50, 30]);
            }

            console.log("Score confirmed:", currentScore);
            
            setTimeout(() => {
                watchFace.style.borderColor = originalBorder;
            }, 500);
        }

        // Simulating Crown Rotation with scroll
        window.addEventListener('wheel', (e) => {
            if (e.deltaY < 0) {
                changeScore(1);
            } else {
                changeScore(-1);
            }
        });

        // Add ripple effect on buttons
        document.querySelectorAll('button, .confirm-btn-arc').forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('interaction-ripple');
                this.appendChild(ripple);
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
</body></html>
