<div class="relative">
<input class="w-full bg-surface-variant border-none rounded-xl h-[56px] text-on-surface font-body-md focus:ring-2 focus:ring-primary px-4 placeholder:text-outline" id="passwordInput" placeholder="Password" type="password" value="password123"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-between items-center px-1">
<a class="text-primary font-body-md text-sm" href="#">Forgot Password?</a>
</div>
<!-- Primary Action with Loading State -->
<button class="w-full h-touch-target bg-secondary-container text-on-secondary-container font-headline-md text-body-lg rounded-full flex items-center justify-center transition-all active:scale-95 shadow-lg overflow-hidden relative" id="loginBtn" onclick="simulateLogin()">
<span id="btnText">Sign In</span>
<div class="hidden absolute inset-0 loading-shimmer" id="btnLoading"></div>
</button>
</div>
</div>
<!-- JS for interactions -->
<script>
        const sheet = document.getElementById('bottomSheet');
        const initialActions = document.getElementById('initialActions');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const errorAlert = document.getElementById('errorAlert');

        function openSheet() {
            sheet.classList.remove('translate-y-full');
            sheet.classList.add('translate-y-0');
        }

        function closeSheet() {
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-full');
        }

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility_off';
            }
        }

        function simulateLogin() {
            btnText.innerText = 'Verifying...';
            btnLoading.classList.remove('hidden');
            loginBtn.disabled = true;
            
            // Artificial delay to show loading state
            setTimeout(() => {
                btnText.innerText = 'Sign In';
                btnLoading.classList.add('hidden');
                loginBtn.disabled = false;
                // Show error state as requested
                errorAlert.classList.remove('hidden');
            }, 2000);
        }

        // Auto-open sheet for demonstration purpose in this prompt
        setTimeout(openSheet, 500);
    </script>
