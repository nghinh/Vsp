<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Golf GPS Glance View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .apple-watch-canvas {
            width: 396px; /* Approx 45mm watch width at high DPI */
            height: 484px; /* Approx 45mm watch height */
            margin: auto;
            position: relative;
            background: #000000;
            border-radius: 60px; /* Precise watch curve */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #1a1a1a;
        }
        .glance-container {
            padding: 24px 20px 20px 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Pulse Animation for GPS Status */
        @keyframes pulse-green {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .gps-pulse {
            animation: pulse-green 2s infinite ease-in-out;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#2d3449",
                      "background": "#000000", /* Overridden for pure OLED black */
                      "primary-container": "#f66018",
                      "on-primary-container": "#4f1700",
                      "primary": "#ffb599",
                      "tertiary": "#68dba9",
                      "on-surface": "#dae2fd",
                      "on-surface-variant": "#e2bfb2",
                      "outline-variant": "#5a4138"
              },
              "fontFamily": {
                      "headline-md": ["Fira Sans"],
                      "display-metrics": ["Fira Code"],
                      "label-caps": ["Fira Sans"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "display-metrics": ["84px", {"lineHeight": "84px", "letterSpacing": "-0.05em", "fontWeight": "700"}],
                      "metric-secondary": ["32px", {"lineHeight": "32px", "fontWeight": "500"}],
                      "label-caps": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- Apple Watch 45mm Simulation Canvas -->
<main class="apple-watch-canvas">
<!-- Glance View Content -->
<div class="glance-container">
<!-- Top Row: Hole Info & GPS Status -->
<header class="flex justify-between items-start pt-2">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-white tracking-tight">Hole 7</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Par 4</span>
</div>
<!-- GPS Ready Indicator -->
<div class="flex items-center gap-2 mt-1">
<div class="w-3 h-3 bg-tertiary rounded-full gps-pulse shadow-[0_0_8px_rgba(104,219,169,0.8)]"></div>
<span class="font-label-caps text-[10px] text-tertiary uppercase tracking-widest">GPS Ready</span>
</div>
</header>
<!-- Center Row: Huge Numeric Distances (The "2-Second Glance" Core) -->
<section class="flex flex-col items-center justify-center flex-grow -mt-4">
<!-- Secondary Front Distance -->
<div class="flex items-baseline gap-2 opacity-90 mb-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">FRONT</span>
<span class="font-display-metrics text-metric-secondary text-white">135</span>
</div>
<!-- Primary Center Distance -->
<div class="relative">
<span class="font-display-metrics text-display-metrics text-primary-container drop-shadow-sm">142</span>
<!-- Distance Unit Subtitle -->
<span class="absolute -right-10 bottom-4 font-label-caps text-headline-md text-primary-container">YDS</span>
</div>
<!-- Secondary Back Distance -->
<div class="flex items-baseline gap-2 opacity-90 mt-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">BACK</span>
<span class="font-display-metrics text-metric-secondary text-white">154</span>
</div>
</section>
<!-- Bottom Row: Score and Action Indicator -->
<footer class="flex justify-between items-end pb-4">
<div class="bg-surface-container-highest px-4 py-2 rounded-full border border-outline-variant/30">
<span class="font-label-caps text-label-caps text-on-surface">SCORE</span>
<span class="font-headline-md text-headline-md text-primary ml-1">+8</span>
</div>
<!-- Battery/Time Context (Subtle) -->
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="battery_charging_full">battery_charging_full</span>
<span class="font-label-caps text-[12px]">82%</span>
</div>
</footer>
</div>
<!-- Subtle Gradient Overlay for Sunlight Contrast -->
<div class="absolute inset-0 pointer-events-none border-[12px] border-black rounded-[60px]"></div>
</main>
<!-- Optional micro-interaction script for haptic feeling -->
<script>
        document.querySelector('.apple-watch-canvas').addEventListener('click', () => {
            // Simulate watch tap feedback
            document.body.style.backgroundColor = '#111';
            setTimeout(() => {
                document.body.style.backgroundColor = '#000';
            }, 50);
        });
    </script>
</body></html>
