# DO NOT EDIT -- overwritten on every update.
#
# Customization surface for vnpt-sec-review-orchestrator.
# Override files (not edited here):
#   {project-root}/_bmad/custom/vnpt-sec-review-orchestrator.toml         (team)
#   {project-root}/_bmad/custom/vnpt-sec-review-orchestrator.user.toml  (personal)

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays: append

# Steps to run before standard activation (config load, greet).
# Use for org pre-flight loads or compliance checks.
activation_steps_prepend = []

# Steps to run after greet, before the build/analyze loop begins.
# Use for context-heavy setup once the user has been acknowledged.
activation_steps_append = []

# Standards the orchestrator keeps in mind for the whole session, loaded as
# context into every run. Each entry is a literal sentence, a `skill:`
# skill, or a `file:` path/glob whose contents load as facts. Use for house
# conventions you want present but not hard-gated (for gates, see
# build_standards).
persistent_facts = [
  "file:{skill-root}/references/state-machine.md",
  "Always use source/config evidence first; scanners corroborate only.",
  "Never close a finding without evidence_after from the latest pass.",
  "Never stop after one review pass — confirmation review is mandatory.",
]

# Executed when a security review run completes, after the user has been told
# the artifact is ready. String scalar (one instruction) or array (in order).
on_complete = ""

# --- Orchestrator gates and budgets ---

# Hard standards every run must satisfy. Unlike persistent_facts (context),
# these are enforced: applied as run criteria and checked again as a
# conformance pass during Validate. Each entry is a `skill:`, `file:`, or
# plain-text directive. Append-only. Empty by default (no org gates).
build_standards = [
  "Every security review run must materialize all artifacts under docs/vnpt-flow/<scope-id>/security-review/.",
  "Every open issue must have evidence_before from source/config.",
  "Every closed issue must have evidence_after from the latest pass.",
  "The bundled validator validate_security_artifacts.py must pass before completion.",
  "The mandatory confirmation review must run after the first zero-issue pass.",
]

# Eval requirement for a security review run to be declared done. Empty (default)
# keeps evals opt-in. Set a directive to gate the run on evals.
#   "baseline"  -- require a passing baseline run
#   "any"       -- require at least one eval case to exist and pass
evals_required = ""

# SKILL.md token budget, measured via scripts/count_tokens.py (cl100k_base).
# Tiered: aim under _desired; between _desired and _budget warns the user;
# over _budget is a hard finding the builder resolves by progressive
# disclosure (lifting sections to references/ or assets/) until it is
# back under budget.
skill_md_token_desired = 2000
skill_md_token_budget = 3000
