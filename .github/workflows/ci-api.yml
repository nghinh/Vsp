name: API CI

# master is the only branch this repository has ever had. The triggers used to
# name main and develop, neither of which exists, so no push to this repository
# could start this workflow — the CI that was meant to guard the API had never
# run once.
on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
      - "infra/migrations/**"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
      - "infra/migrations/**"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    name: API CI (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 only. apps/api/pom.xml sets maven.compiler.release 21, so the
        # Java 17 leg of this matrix could only ever fail on "invalid target
        # release: 21" at the Compile step, which has no continue-on-error.
        java-version: ["21"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Validate
        run: mvn -B validate
        working-directory: apps/api

      - name: Compile
        run: mvn -B compile
        working-directory: apps/api

      - name: Test
        run: mvn -B test
        working-directory: apps/api

      - name: OWASP Dependency Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=dependency-check-suppressions.xml
        working-directory: apps/api
        continue-on-error: true

      - name: Build package
        run: mvn -B package -DskipTests
        working-directory: apps/api

  # The migrations get their own job with a real PostGIS behind it, because the
  # only way to know they work is to run them into an empty database — which is
  # exactly what no environment did, and how db/migration came to be 10 tables,
  # 175 columns and one missing PostGIS extension away from the entity model.
  #
  # Separate from api-ci on purpose: the other PostgreSQL-backed tests assert
  # against seeded dev data and would fail against an empty database, so api-ci
  # deliberately runs with no database reachable and they skip there.
  api-schema:
    name: Migrations match the entity model
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vsp
          POSTGRES_PASSWORD: vsp_dev_password
          POSTGRES_DB: vsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      # Runs every migration into a database created from empty, then boots
      # Hibernate with ddl-auto=validate over all 64 @Entity classes. Fails if a
      # migration does not apply, if one is silently skipped for not matching
      # Flyway's naming convention, or if the resulting schema is missing so
      # much as a column the code expects.
      - name: Flyway builds the schema the entities expect
        run: mvn -B test -Dtest=FlywaySchemaMatchesEntityModelTest -DfailIfNoTests=false
        working-directory: apps/api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: vsp
          POSTGRES_USER: vsp
          POSTGRES_PASSWORD: vsp_dev_password

  api-secrets:
    name: API Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # zricethezav/gitleaks-action moved to gitleaks/gitleaks-action; the old
      # coordinates no longer resolve, and the SHA that was pinned here existed
      # in neither repository.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@1f2d10fb689bc07a5f56f48d6db61f5bbbe772fa  # v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 is configured entirely through the environment —
          # it declares no `with:` inputs at all, so the scan-commit,
          # scan-commits-files and baseline-path arguments this step used to
          # pass were silently ignored (and .gitleaks-baseline.json has never
          # existed in this repository).
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
