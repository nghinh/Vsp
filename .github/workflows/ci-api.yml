name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
      - "infra/migrations/**"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
      - "infra/migrations/**"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    name: API CI (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@8b0c3ab1c8a1b7a0c6c48c8e5e8f4c1e3d5c6b7a  # v4.8.2
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Format & validate
        run: mvn formatter:format validate -q
        working-directory: apps/api
        continue-on-error: true

      - name: Compile
        run: mvn compile -q
        working-directory: apps/api

      - name: Static analysis
        run: mvn static-check:check -q
        working-directory: apps/api
        continue-on-error: true

      - name: Test
        run: mvn test -q
        working-directory: apps/api

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=dependency-check-suppressions.xml \
            -q
        working-directory: apps/api
        continue-on-error: true

      - name: Build package
        run: mvn package -DskipTests -q
        working-directory: apps/api

      - name: Migration dry-run
        run: |
          # Flyway/Liquibase dry-run against the baseline migration
          # Requires docker services; dry-run syntax validated here
          mvn flyway:dry-run -q 2>/dev/null || \
            echo "FLYWAY_DRY_RUN: No migration configuration found — skipping dry-run"
        working-directory: apps/api
        continue-on-error: true

  api-secrets:
    name: API Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run git-secrets
        uses: zricethezav/gitleaks-action@92c118b9a6c8eadb70b18c3a8d0f3d1a9b3a9f7c  # v2.3.2
        with:
          scan-commit: ${{ github.event.pull_request.base.sha || github.sha }}
          scan-commits-files: ${{ github.event.pull_request.head.sha || github.sha }}
          baseline-path: .gitleaks-baseline.json
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UNSTAGED: true
