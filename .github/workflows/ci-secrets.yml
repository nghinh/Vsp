name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Repository-wide Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@92c118b9a6c8eadb70b18c3a8d0f3d1a9b3a9f7c  # v2.3.2
        with:
          scan-commit: ${{ github.event.pull_request.base.sha || github.sha }}
          scan-commits-files: ${{ github.event.pull_request.head.sha || github.sha }}
          baseline-path: .gitleaks-baseline.json
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UNSTAGED: true
