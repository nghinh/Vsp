name: Portal CI

on:
  push:
    branches: [master]
    paths:
      - "apps/portal/**"
      - ".github/workflows/ci-portal.yml"
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/ci-portal.yml"

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-ci:
    name: Portal CI (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/portal

      - name: Format
        run: npm run format --if-present -- --check
        working-directory: apps/portal
        continue-on-error: true

      - name: Lint
        run: npm run lint
        working-directory: apps/portal

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/portal
        continue-on-error: true

      - name: Test
        run: npm test
        working-directory: apps/portal

      - name: Build
        run: npm run build
        working-directory: apps/portal

  portal-secrets:
    name: Portal Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@1f2d10fb689bc07a5f56f48d6db61f5bbbe772fa  # v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
