name: Portal CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/portal/**"
      - ".github/workflows/ci-portal.yml"
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/ci-portal.yml"

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-ci:
    name: Portal CI (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@18e4a6dd9b4f3e1c6c77c8ae2e6b6f1b8e3c2c5a  # v4.3.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/portal

      - name: Format
        run: npm run format --if-present -- --check
        working-directory: apps/portal
        continue-on-error: true

      - name: Lint
        run: npm run lint
        working-directory: apps/portal

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/portal
        continue-on-error: true

      - name: Test
        run: npm test
        working-directory: apps/portal

      - name: Build
        run: npm run build
        working-directory: apps/portal

  portal-secrets:
    name: Portal Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run git-secrets
        uses: zricethezav/gitleaks-action@92c118b9a6c8eadb70b18c3a8d0f3d1a9b3a9f7c  # v2.3.2
        with:
          scan-commit: ${{ github.event.pull_request.base.sha || github.sha }}
          scan-commits-files: ${{ github.event.pull_request.head.sha || github.sha }}
          baseline-path: .gitleaks-baseline.json
        env:
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UNSTAGED: true
