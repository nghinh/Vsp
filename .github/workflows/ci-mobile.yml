name: Mobile CI

# master is the only branch this repository has ever had; main and develop do
# not exist, so nothing could ever have triggered this workflow.
on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ci:
    name: Flutter CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295  # v2.22.0
        with:
          # No flutter-version. This input takes a concrete version such as
          # "3.24.0"; it was set to the range ">=3.10.0", which is a pubspec
          # constraint and not something this action can resolve. `channel:
          # stable` alone takes the current stable, which satisfies the
          # ">=3.10.0" Dart SDK constraint in apps/mobile/pubspec.yaml.
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      # `flutter format` was removed in Flutter 3 — it answers "Could not find a
      # command named format" and exits non-zero, with no continue-on-error on
      # this step. It is `dart format` now.
      - name: Format
        # --output=none so this reports rather than rewrites: `dart format`
        # writes the files back by default, and a CI step that edits the
        # checkout before the analyze and test steps see it is not a check.
        #
        # Reporting only, for now: 177 of the 553 files under lib/ and test/ do
        # not match `dart format` today. Blocking on that here would paint every
        # run red for a reason unrelated to the change being tested, and
        # reformatting a third of the app is its own commit, not a side effect
        # of repairing the workflow. Drop continue-on-error once it is done.
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
        working-directory: apps/mobile

      - name: Test
        run: flutter test
        working-directory: apps/mobile

      - name: Build (debug APK)
        if: runner.os == 'Linux'
        run: flutter build apk --debug
        working-directory: apps/mobile

      - name: Upload APK artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flutter-debug-apk-${{ matrix.os }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5

  flutter-secrets:
    name: Mobile Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # See ci-api.yml: the action moved to the gitleaks org and takes its
      # configuration from the environment, not from `with:`.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@1f2d10fb689bc07a5f56f48d6db61f5bbbe772fa  # v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
