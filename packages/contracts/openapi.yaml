  /courses/{courseId}/packages/current:
    get:
      operationId: getCurrentPackageManifest
      summary: Get the currently active package manifest for a course
      description: |
        Returns the manifest for the package that is currently effective
        (effectiveDate <= now < expiresAt). Used by the mobile app to
        check for available updates (Story 4.4).
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
