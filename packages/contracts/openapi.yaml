  /payments/intent:
    post:
      operationId: createPaymentIntent
      summary: Create a payment intent
      description: |
        Creates a new payment intent and returns a provider reference.
        The payment is not confirmed until confirmPayment is called or a provider webhook fires.
        Idempotency key required via Idempotency-Key header.
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
        '400':
          description: Missing idempotency key or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate idempotency key with different request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get payment status
