openapi: 3.1.0
info:
  title: Vietnam Smart Golf Platform API
  description: |
    REST API for the Vietnam Smart Golf Platform.
    Covers identity, course catalog, geospatial, round/score, weather, correction workflow, and audit.
  version: 0.1.0
  contact:
    name: VSP Platform Team
  license:
    name: Proprietary

servers:
  - url: https://api.vsp.local
    description: Local development
  - url: https://api.vsp-staging.example.com
    description: Staging environment
  - url: https://api.vsp.example.com
    description: Production environment

paths:
  # ========================
  # Auth endpoints
  # ========================
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      operationId: register
      summary: Register new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token and rotate refresh token
      description: |
        Refreshes the access token using the refresh token.
        Per Story 2.2 AC-1: refresh tokens rotate on each use.
        The old refresh token is marked revoked and a new one is issued.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Token refreshed with rotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      description: Returns all active (non-revoked, non-expired) sessions for the authenticated golfer.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - name: currentSessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Marks the session with this ID as "current" in the response
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a specific session
      description: |
        Revokes the specified session. The revoked session's refresh token will no longer work.
        Per Story 2.2 AC-3: revoked sessions cannot refresh.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The session ID to revoke
      responses:
        '204':
          description: Session revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Logout user
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/phone:
    post:
      operationId: registerWithPhone
      summary: Register golfer account with phone number
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRegisterRequest'
      responses:
        '201':
          description: Account created and OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Phone number already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/email:
    post:
      operationId: registerWithEmail
      summary: Register golfer account with email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegisterRequest'
      responses:
        '201':
          description: Account created and OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/send:
    post:
      operationId: sendOtp
      summary: Send OTP code to phone or email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify OTP code and activate account
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password/recover:
    post:
      operationId: initiatePasswordRecovery
      summary: Initiate password recovery
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoverRequest'
      responses:
        '200':
          description: Recovery OTP sent if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Reset password using recovery token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid or expired recovery token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      operationId: getCurrentProfile
      summary: Get current authenticated golfer profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolferProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/google:
    post:
      operationId: authenticateWithGoogle
      summary: Authenticate using Google Sign-In
      description: |
        Exchanges a Google ID token for a VSP access token.
        If the Google email matches an existing VSP account, the Google subject
        is linked to that canonical account (account linking).
        Otherwise, a new VSP account is created and linked to the Google subject.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Google authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
        '400':
          description: Invalid or expired Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Social account already linked to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/apple:
    post:
      operationId: authenticateWithApple
      summary: Authenticate using Apple Sign-In
      description: |
        Exchanges an Apple identity token for a VSP access token.
        If the Apple email matches an existing VSP account, the Apple subject
        is linked to that canonical account (account linking).
        Otherwise, a new VSP account is created and linked to the Apple subject.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Apple authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
        '400':
          description: Invalid or expired Apple identity token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Social account already linked to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========================
  # Profiles endpoints
  # ========================
  /profiles/me:
    get:
      operationId: getMyProfile
      summary: Get the authenticated golfer's profile
      description: |
        Returns the golfer's golf-preference profile.
        Auto-creates a default profile with sensible defaults (unit=METERS, hand=RIGHT, skill=INTERMEDIATE)
        on first access if no profile exists.
        Per Story 2.3 AC-1: returns all profile fields.
        Per Story 2.3 AC-2: returns canonical values (meters) and display-unit preference.
      tags: [Profiles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Golfer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolferProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateMyProfile
      summary: Update the authenticated golfer's profile
      description: |
        Updates the golfer's golf-preference profile. All fields are optional for partial update.
        Per Story 2.3 AC-1: all golf preference fields are updatable.
        Per Story 2.3 AC-2: canonical meters values are preserved; only display-unit field changes.
      tags: [Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGolferProfileRequest'
      responses:
        '200':
          description: Updated golfer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolferProfileResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========================
  # User Course endpoints (Story 3.2 SD-BACK-2)
  # ========================
  /users/me/favorites:
    get:
      operationId: listMyFavorites
      summary: List favorited courses for the authenticated user
      description: |
        Returns all favorited courses for the authenticated golfer.
        Per Story 3.2 AC-1: favorites support.
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of favorited courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteCourseDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addFavorite
      summary: Add a course to favorites
      description: |
        Adds a course to the authenticated golfer's favorites.
        Per Story 3.2 AC-1: favorites support.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Course ID to add to favorites
      responses:
        '201':
          description: Course added to favorites
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/favorites/{courseId}:
    delete:
      operationId: removeFavorite
      summary: Remove a course from favorites
      description: |
        Removes a course from the authenticated golfer's favorites.
        Per Story 3.2 AC-1: favorites support.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Course ID to remove from favorites
      responses:
        '204':
          description: Course removed from favorites
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Favorite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/recent:
    get:
      operationId: listMyRecentCourses
      summary: List recently viewed courses for the authenticated user
      description: |
        Returns the most recently viewed courses for the authenticated golfer.
        Returns up to 'limit' most recent entries (default 10).
        Per Story 3.2 AC-1: recent support.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
          description: Maximum number of recent courses to return
      responses:
        '200':
          description: List of recently viewed courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentCourseDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: recordRecentView
      summary: Record a course view
      description: |
        Records a course view for the authenticated golfer.
        Updates viewedAt if the course was already recently viewed.
        Enforces the 10-entry per-user cap by trimming oldest entries.
        Per Story 3.2 AC-1: recent support.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Course ID to record as viewed
      responses:
        '201':
          description: Course view recorded
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========================
  # Bags endpoints
  # ========================
  /bags:
    get:
      operationId: listBags
      summary: List all bags for the authenticated golfer
      description: |
        Returns all golf bags for the authenticated golfer.
        Auto-creates a default bag on first access if none exist.
        Per Story 2.4 AC-1: lists all bags.
        Per Story 2.4 AC-2: exactly one bag is active at a time.
      tags: [Bags]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of golf bags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GolfBagResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createBag
      summary: Create a new golf bag
      description: |
        Creates a new golf bag for the authenticated golfer.
        Per Story 2.4 AC-1: creates a new bag with a given name.
      tags: [Bags]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGolfBagRequest'
      responses:
        '201':
          description: Bag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolfBagResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bags/{bagId}:
    get:
      operationId: getBag
      summary: Get a specific bag by ID
      description: |
        Returns a specific golf bag by ID.
        Per Story 2.4 AC-1: returns bag with all fields and clubs.
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID
      responses:
        '200':
          description: Golf bag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolfBagResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateBag
      summary: Update a bag
      description: |
        Updates a golf bag (partial update — all fields optional).
        Per Story 2.4 AC-1: editable fields include name and isActive.
        Per Story 2.4 AC-2: setting isActive to true activates this bag and deactivates all others.
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGolfBagRequest'
      responses:
        '200':
          description: Bag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolfBagResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBag
      summary: Delete a bag
      description: |
        Deletes a golf bag. All clubs in the bag are also deleted.
        Per Story 2.4 AC-1: bags can be deleted.
        Fails if it is the last remaining bag (BAG_002).
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID
      responses:
        '204':
          description: Bag deleted
        '400':
          description: Cannot delete last bag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bags/{bagId}/activate:
    post:
      operationId: activateBag
      summary: Set a bag as the active bag
      description: |
        Sets the specified bag as the active bag, deactivating all other bags for this golfer.
        Per Story 2.4 AC-2: exactly one bag is active at a time — transactional enforcement.
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID to activate
      responses:
        '200':
          description: Bag activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GolfBagResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bags/{bagId}/clubs:
    get:
      operationId: listClubs
      summary: List all clubs in a bag
      description: |
        Returns all clubs belonging to a specific golf bag.
        Per Story 2.4 AC-1: clubs with loft, carry, total, dispersion, shaft, useDate.
        Per PRD Phase 2: dispersion stored but not used in MVP recommendations.
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID
      responses:
        '200':
          description: List of clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createClub
      summary: Add a club to a bag
      description: |
        Creates a new club in the specified golf bag.
        Per Story 2.4 AC-1: all club fields supported — clubType, loft, carryDistance, totalDistance, dispersion, shaft, useDate.
        Distances accepted as canonical meters.
        Dispersion stored (Phase 2 scope) but not used in MVP recommendations.
      tags: [Bags]
      security:
        - bearerAuth: []
      parameters:
        - name: bagId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Bag ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClubRequest'
      responses:
        '201':
          description: Club created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bags/{bagId}/clubs/{clubId}:
    put:
      operationId: updateClub
      summary: Update a club
      description: |
