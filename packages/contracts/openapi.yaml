  /courses/search:
    get:
      operationId: searchCourses
      summary: Search courses by text and/or geographic location
      description: |
        Supports three modes: text-only (q), nearby-only (lat/lng/radius), or combined.
        Enriches each result with DataFreshnessDto, hasPackage, and updateAvailable.
        Per Story 3.2 AC-1: text and geographic filters with paginated results.
        Per Story 3.2 AC-2: ST_DWithin for nearby searches.
        Per Story 3.2 AC-3: verification, data freshness, download, and update state.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Text search query (facility name, course name, address)
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitude of search center (WGS84)
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitude of search center (WGS84)
        - name: radius
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 50000
          description: Search radius in meters (max 50km)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number (0-indexed)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: downloadedVersion
          in: query
          required: false
          schema:
            type: integer
          description: Mobile-reported downloaded version number — if provided, response includes updateAvailable
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSearchResultDto'
                  page:
                    type: integer
                    example: 0
                  size:
                    type: integer
                    example: 20
                  totalElements:
                    type: integer
                    format: int64
                    example: 150
                  totalPages:
                    type: integer
                    example: 8
                  first:
                    type: boolean
                    example: true
                  last:
                    type: boolean
                    example: false
        '400':
          description: Invalid coordinates or radius exceeds maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/nearby:
    get:
      operationId: findNearbyCourses
      summary: Find courses within radius of a location
      description: |
        Pure nearby search — returns courses ordered by distance from the provided coordinates.
        Uses ST_DWithin with GIST spatial index for efficient filtering.
        Per Story 3.2 AC-2: index-aware spatial filtering.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitude of search center (WGS84)
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitude of search center (WGS84)
        - name: radius
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 50000
          description: Search radius in meters (max 50km)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number (0-indexed)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
      responses:
        '200':
          description: Paginated nearby courses ordered by distance
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSearchResultDto'
                  page:
                    type: integer
                    example: 0
                  size:
                    type: integer
                    example: 20
                  totalElements:
                    type: integer
                    format: int64
                    example: 12
                  totalPages:
                    type: integer
                    example: 1
                  first:
                    type: boolean
                    example: true
                  last:
                    type: boolean
                    example: true
        '400':
          description: Invalid coordinates or radius exceeds maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

