components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token

  schemas:
    # Common schemas
    Error:
      $ref: './schemas/common.yaml#/Error'
    Pagination:
      $ref: './schemas/common.yaml#/Pagination'
    PageToken:
      $ref: './schemas/common.yaml#/PageToken'
    IdempotencyKey:
      $ref: './schemas/common.yaml#/IdempotencyKey'
    Location:
      $ref: './schemas/common.yaml#/Location'

    # Auth schemas
    LoginRequest:
      $ref: './schemas/auth.yaml#/LoginRequest'
    LoginResponse:
