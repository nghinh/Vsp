          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/confirm:
    post:
      operationId: confirmPayment
      summary: Confirm a payment (provider webhook/callback)
      description: |
        Called by provider webhook or client callback to confirm payment state.
        Idempotency key required via Idempotency-Key header.
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
