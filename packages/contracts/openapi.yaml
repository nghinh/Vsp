        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundUpdate'
      responses:
        '200':
          description: Round updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
        '404':
          description: Round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Round cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Shots (Story 10.3) ───────────────────────────────────────────────────

  /rounds/{roundId}/shots:
    get:
      operationId: listShots
      summary: List shots for a round with sync cursor
      description: |
        Returns all shots for the specified round belonging to the authenticated player.
        Supports delta sync via optional `cursor` query parameter.
        Per Story 10.3 Slice 1.
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Sync cursor from previous response for delta sync
      responses:
        '200':
          description: Shot list with sync cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createShot
      summary: Create (start) a new shot
      description: |
        Records the start of a new shot. Idempotent: if the same idempotencyKey
        is submitted twice, returns the existing shot without creating a duplicate.
        Per Story 10.3 Slice 1.
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Client-generated UUID v4 for idempotent shot creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShotRequest'
      responses:
        '201':
          description: Shot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
          headers:
            X-Idempotent-Replay:
              schema:
                type: boolean
              description: 'true if this request was deduplicated (already existed)'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shots/{shotId}:
    get:
      operationId: getShot
      summary: Get a shot by ID
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: shotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shot'
        '404':
          description: Shot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: updateShot
      summary: Update (edit) a shot
      description: |
        Partial update for a shot. All fields are optional — only those present
        in the request body are updated.
        Idempotent: submitting the same idempotencyKey twice returns the current
        shot state without error.
        Per Story 10.3 Slice 1.
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: shotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Client-generated UUID v4 for idempotent update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShotRequest'
      responses:
        '200':
          description: Shot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
          headers:
            X-Idempotent-Replay:
              schema:
                type: boolean
              description: 'true if this request was deduplicated'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteShot
      summary: Delete a shot
      description: |
        Soft-deletes a shot (sets deletedAt timestamp). Idempotent: if already
        deleted, returns 200 without error.
        Per Story 10.3 Slice 1.
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: shotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Client-generated UUID v4 for idempotent deletion
      responses:
        '200':
          description: Shot deleted (or already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
        '404':
          description: Shot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rounds/{roundId}/shots/merge:
    post:
      operationId: mergeShots
      summary: Merge two shots
      description: |
        Marks the source shot as merged into the target shot.
        The source shot's mergedIntoShotId is set to targetShotId.
        Both shots must belong to the same round and player.
        Idempotent: if already merged, returns 200.
        Per Story 10.3 Slice 1.
      tags: [Shots]
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Client-generated UUID v4 for idempotent merge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeShotsRequest'
      responses:
        '200':
          description: Shots merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
        '400':
          description: Validation error (shots not in same round/player)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shot or round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rounds/{roundId}/complete:
    post:
      operationId: completeRound
      summary: Complete an in-progress round
      description: |
        Marks a round as completed. Idempotent: if the round is already COMPLETED,
        returns 200 without error.
        Validates that the round exists and belongs to the authenticated golfer.
        Sets status=COMPLETED and endedAt=now() if not already set.
        Per Story 5.5 Slice 1.
      tags: [Rounds]
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Round UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundCompleteRequest'
      responses:
        '200':
          description: Round completed (or already completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundCompleteResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rounds/{roundId}/corrections:
    post:
      operationId: submitScoreCorrections
      summary: Submit score corrections for a completed round
      description: |
        Applies field-level corrections to score entries for a completed round.
        Validates that the round is COMPLETED, corrections target permitted fields only,
        and creates audit entries for each change.
        Per Story 5.5 Slice 4.
      tags: [Rounds]
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Round UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreCorrectionRequest'
      responses:
        '200':
          description: Corrections applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreCorrectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Round not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Round not completed — corrections only allowed on completed rounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error — field not permitted or invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

