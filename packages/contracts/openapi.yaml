tags:
  - name: Auth
    description: Authentication and authorization
  - name: Profiles
    description: Golfer profile and preference management
  - name: Bags
    description: Golf bag and club management
  - name: Courses
    description: Course catalog management
  - name: Packages
    description: Course package management
  - name: Rounds
    description: Golf round management
  - name: Shots
    description: Manual shot tracking — start, edit, delete, merge shots per Story 10.3
  - name: Scores
    description: Score tracking and leaderboards
  - name: Weather
    description: Weather information
  - name: Corrections
    description: Course data correction workflow
  - name: Privacy
    description: Privacy requests for data export, account deletion, round deletion (per Story 2.5 AC-3)
  - name: Alerts
    description: Course alert management — send, track, and acknowledge targeted safety and promotion alerts (per Story 8.6)
  - name: Admin
    description: Admin RBAC role management, MFA, and privacy request processing (per Story 2.5)
  - name: Analytics
    description: Driving zone and round analytics (per Story 11.2)
  - name: Booking
    description: Tee time booking and reservation management (per Story 12.2)
  - name: Membership
    description: Membership plans and entitlements (per Story 12.2)
  - name: Loyalty
    description: Loyalty points and rewards program (per Story 12.2)
  - name: Sponsorship
    description: Sponsorship and advertising management (per Story 12.2)
  - name: Payments
    description: Payment intents, confirmations, refunds, and reconciliation (per Story 12.3)
  - name: Markets
    description: Market configuration and license management for international expansion (per Story 12.4)
